      - Remplacer SQL
      - Compiler le CSS
    answer:
      - 1
    explanation: |
      Typage avancé.
    skills:
      - patterns
  - id: typescript-38-builder-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Valider dans build() sert à :
    options:
      - Rien
      - Garantir un objet cohérent
      - Désactiver strict
      - Créer une route HTTP
    answer:
      - 1
    explanation: |
      Invariants.
    skills:
      - patterns
