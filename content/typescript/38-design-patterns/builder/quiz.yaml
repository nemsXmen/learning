    difficulty: 1
    question: |
      L’API fluent d’un builder s’appuie souvent sur :
    options:
      - return this
      - return never
      - process.exit
      - Uniquement des static
    answer:
      - 0
    explanation: |
      Chaînage.
    skills:
      - patterns
