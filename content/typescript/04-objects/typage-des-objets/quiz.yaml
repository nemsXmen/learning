id: typage-des-objets-quiz
kind: QUIZ
questions:
  - id: typescript-04-typage-des-objets-q1
    type: multiple_choice
    difficulty: 1
    question: >
      Quelle est une annotation correcte pour un objet avec name (string) et age (number) ?
    options:
      - "{ name: string, age: number }"
      - "{ name: string; age: number }"
      - "object(name: string, age: number)"
      - "Object<string, number>"
    answer: [1]
    explanation: >
      On utilise des points-virgules (ou des virgules) entre les propriétés dans le type objet.
    skills: [objects]

  - id: typescript-04-typage-des-objets-q2
    type: true_false
    difficulty: 1
    question: >
      Il est recommandé de créer un type ou une interface dès que la forme d’un objet est réutilisée.
    options:
      - "true"
      - "false"
    answer: false
    explanation: >
      Oui, pour éviter la duplication et nommer clairement le concept.
    skills: [objects]

  - id: typescript-04-typage-des-objets-q3
    type: multiple_choice
    difficulty: 2
    question: >
      Que se passe-t-il si une propriété obligatoire manque dans l’objet ?
    options:
      - Rien
      - Erreur de compilation
      - La propriété vaut undefined silencieusement
      - Conversion en any
    answer: [1]
    explanation: >
      TypeScript signale la propriété manquante.
    skills: [objects]

  - id: typescript-04-typage-des-objets-q4
    type: multiple_choice
    difficulty: 1
    question: >
      L’inférence fonctionne-t-elle sur les objets littéraux ?
    options:
      - Non
      - Oui
      - Uniquement en mode non-strict
      - Uniquement avec const
    answer: [1]
    explanation: >
      Oui, TypeScript infère la forme de l’objet à partir de ses propriétés.
    skills: [objects]
