id: excess-property-checking-quiz
kind: QUIZ
questions:
  - id: typescript-04-excess-property-checking-q1
    type: multiple_choice
    difficulty: 2
    question: |
      Quand TypeScript applique-t-il le excess property checking ?
    options:
      - Sur toutes les assignations d’objets
      - Principalement sur les objets littéraux frais
      - Uniquement en mode non-strict
      - Jamais
    answer:
      - 1
    explanation: |
      Le contrôle est surtout actif sur les littéraux.
    skills:
      - objects
  - id: typescript-04-excess-property-checking-q2
    type: true_false
    difficulty: 1
    question: >
      Une variable intermédiaire peut faire disparaître une erreur d’excess
      property.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, car on passe alors en typage structurel classique.
    skills:
      - objects
  - id: typescript-04-excess-property-checking-q3
    type: multiple_choice
    difficulty: 2
    question: |
      À quoi sert le excess property checking ?
    options:
      - À ralentir le compilateur
      - À détecter les propriétés en trop / fautes de frappe sur les littéraux
      - À activer any
      - À rendre les objets readonly
    answer:
      - 1
    explanation: |
      C’est une protection contre les propriétés inattendues.
    skills:
      - objects
  - id: typescript-04-excess-property-checking-q4
    type: multiple_choice
    difficulty: 1
    question: >
      `const u: { name: string } = { name: "A", age: 1 }` provoque-t-il une
      erreur ?
    options:
      - Non
      - Oui (excess property)
      - Uniquement à runtime
      - Uniquement avec strictNullChecks
    answer:
      - 1
    explanation: |
      Oui, age n’existe pas sur le type cible.
    skills:
      - objects
