id: objets-imbriques-quiz
kind: QUIZ
questions:
  - id: typescript-04-objets-imbriques-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Comment type-t-on un objet qui contient un autre objet ?
    options:
      - En interdisant l’imbrication
      - En déclarant un type pour le sous-objet et en l’utilisant comme type de
        propriété
      - Uniquement avec any
      - Avec des tableaux uniquement
    answer:
      - 1
    explanation: |
      On compose les types objets entre eux.
    skills:
      - objects
  - id: typescript-04-objets-imbriques-q2
    type: true_false
    difficulty: 1
    question: |
      TypeScript vérifie les accès en chaîne comme `user.address.city`.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, chaque segment est vérifié.
    skills:
      - objects
  - id: typescript-04-objets-imbriques-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Quelle est une bonne pratique pour les objets imbriqués ?
    options:
      - Tout mettre en inline sur une seule ligne
      - Nommer les sous-types significatifs
      - Utiliser any pour les niveaux profonds
      - Éviter complètement l’imbrication
    answer:
      - 1
    explanation: |
      Des types nommés rendent le code plus clair et maintenable.
    skills:
      - objects
  - id: typescript-04-objets-imbriques-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Que se passe-t-il si un objet imbriqué obligatoire est manquant ?
    options:
      - Rien
      - Erreur de compilation
      - Il vaut null
      - Conversion en string
    answer:
      - 1
    explanation: |
      Comme toute propriété obligatoire, son absence provoque une erreur.
    skills:
      - objects
