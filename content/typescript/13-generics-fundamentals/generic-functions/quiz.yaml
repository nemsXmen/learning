id: typescript-13-generic-typescript-basics-quiz
kind: QUIZ
questions:
  - id: typescript-13-generic-typescript-basics-q1
    type: multiple_choice
    difficulty: 1
    question: |
      La syntaxe d’une fonction générique commence par :
    options:
      - function f(T)
      - function f<T>(...)
      - generic function f
      - function f[T](...)
    answer:
      - 1
    explanation: |
      Les paramètres de type sont entre chevrons après le nom.
    skills:
      - generics
  - id: typescript-13-generic-typescript-basics-q2
    type: true_false
    difficulty: 1
    question: |
      TypeScript peut inférer T à partir des arguments.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, c’est le comportement par défaut.
    skills:
      - generics
  - id: typescript-13-generic-typescript-basics-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Comment force-t-on le paramètre de type explicitement ?
    options:
      - f(Type)
      - f<Type>(...)
      - f as Type
      - '{"f":"Type"}'
    answer:
      - 1
    explanation: |
      On place le type entre chevrons à l’appel.
    skills:
      - generics
  - id: typescript-13-generic-typescript-basics-q4
    type: multiple_choice
    difficulty: 1
    question: |
      `first([1, 2, 3])` avec `first<T>(items: T[])` infère T comme :
    options:
      - any
      - number
      - unknown
      - object
    answer:
      - 1
    explanation: |
      Le tableau de numbers fixe T = number.
    skills:
      - generics
