id: typescript-13-generic-constraints-quiz
kind: QUIZ
questions:
  - id: typescript-13-generic-constraints-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Comment contraint-on un paramètre de type ?
    options:
      - T implements Constraint
      - T extends Constraint
      - '{"T":"Constraint"}'
      - T as Constraint
    answer:
      - 1
    explanation: |
      On utilise extends.
    skills:
      - generics
  - id: typescript-13-generic-constraints-q2
    type: true_false
    difficulty: 1
    question: |
      Avec `T extends { length: number }`, on peut accéder à value.length.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, la contrainte le garantit.
    skills:
      - generics
  - id: typescript-13-generic-constraints-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Sans contrainte, que peut-on faire de façon sûre sur un T nu ?
    options:
      - Appeler n’importe quelle méthode
      - Presque rien (opérations communes minimales)
      - Uniquement des calculs numériques
      - Tout ce qu’on veut
    answer:
      - 1
    explanation: |
      T est trop large sans contrainte.
    skills:
      - generics
  - id: typescript-13-generic-constraints-q4
    type: multiple_choice
    difficulty: 2
    question: |
      `getLength(42)` avec `T extends { length: number }` :
    options:
      - Compile
      - Ne compile pas (number n’a pas length)
      - Retourne 0
      - Est any
    answer:
      - 1
    explanation: |
      number ne satisfait pas la contrainte.
    skills:
      - generics
