id: typescript-13-pourquoi-les-generics-quiz
kind: QUIZ
questions:
  - id: typescript-13-pourquoi-les-generics-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Les generics servent principalement à :
    options:
      - Désactiver le typage
      - Réutiliser du code en conservant des types précis
      - Remplacer les classes
      - Accélérer le runtime uniquement
    answer:
      - 1
    explanation: |
      Réutilisation + sécurité de types.
    skills:
      - generics
  - id: typescript-13-pourquoi-les-generics-q2
    type: true_false
    difficulty: 1
    question: |
      Sans generics, on finit souvent par utiliser any ou dupliquer des fonctions.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - generics
  - id: typescript-13-pourquoi-les-generics-q3
    type: multiple_choice
    difficulty: 1
    question: |
      Dans `function identity<T>(value: T): T`, T est :
    options:
      - Une valeur
      - Un paramètre de type
      - Un décorateur
      - Un enum
    answer:
      - 1
    explanation: |
      C’est un type parameter.
    skills:
      - generics
  - id: typescript-13-pourquoi-les-generics-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Après `identity(42)`, le type de retour inféré est :
    options:
      - any
      - number
      - unknown
      - object
    answer:
      - 1
    explanation: |
      T est inféré comme number.
    skills:
      - generics
