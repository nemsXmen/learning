id: typescript-13-plusieurs-parametres-generiques-quiz
kind: QUIZ
questions:
  - id: typescript-13-plusieurs-parametres-generiques-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Comment déclare-t-on deux paramètres de type ?
    options:
      - <T + U>
      - <T, U>
      - <T & U>
      - <T | U>
    answer:
      - 1
    explanation: |
      Séparés par des virgules.
    skills:
      - generics
  - id: typescript-13-plusieurs-parametres-generiques-q2
    type: true_false
    difficulty: 1
    question: |
      Chaque paramètre de type peut être inféré indépendamment.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - generics
  - id: typescript-13-plusieurs-parametres-generiques-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Dans `map<T, U>(items: T[], fn: (item: T) => U)`, U représente :
    options:
      - Le type des éléments d’entrée
      - Le type de retour du callback / des éléments de sortie
      - Uniquement any
      - Un enum
    answer:
      - 1
    explanation: |
      U est le type produit par le mapper.
    skills:
      - generics
  - id: typescript-13-plusieurs-parametres-generiques-q4
    type: multiple_choice
    difficulty: 1
    question: |
      L’ordre des paramètres de type :
    options:
      - N’a aucune importance
      - Compte pour les arguments de type explicites
      - Est imposé par le runtime
      - Doit être alphabétique
    answer:
      - 1
    explanation: |
      f<string, number>(...) suit l’ordre de déclaration.
    skills:
      - generics
