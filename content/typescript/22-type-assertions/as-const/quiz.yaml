id: typescript-22-as-const-quiz
kind: QUIZ
questions:
  - id: typescript-22-as-const-q1
    type: multiple_choice
    difficulty: 1
    question: |
      `["a", "b"] as const` produit un type proche de :
    options:
      - string[]
      - readonly ["a", "b"]
      - any[]
      - '["string","string"]'
    answer:
      - 1
    explanation: |
      Tuple readonly de littéraux.
    skills:
      - type-assertions
  - id: typescript-22-as-const-q2
    type: true_false
    difficulty: 1
    question: |
      as const empêche l’élargissement des littéraux string/number.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - type-assertions
  - id: typescript-22-as-const-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Pour dériver une union depuis un tableau as const, on utilise souvent :
    options:
      - keyof only
      - (typeof arr)[number]
      - ReturnType
      - Exclude
    answer:
      - 1
    explanation: |
      Indexation par number.
    skills:
      - type-assertions
  - id: typescript-22-as-const-q4
    type: multiple_choice
    difficulty: 1
    question: |
      as const sur un objet rend les props :
    options:
      - Optionnelles
      - Readonly avec des littéraux précis
      - any
      - Privées
    answer:
      - 1
    explanation: |
      Readonly + littéraux.
    skills:
      - type-assertions
