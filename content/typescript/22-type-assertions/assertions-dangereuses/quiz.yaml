id: typescript-22-assertions-dangereuses-quiz
kind: QUIZ
questions:
  - id: typescript-22-assertions-dangereuses-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Une assertion dangereuse classique est :
    options:
      - as const sur un tableau de config
      - JSON.parse(data) as User sans validation
      - typeof narrowing
      - Un type guard
    answer:
      - 1
    explanation: |
      Pas de validation des champs.
    skills:
      - type-assertions
  - id: typescript-22-assertions-dangereuses-q2
    type: true_false
    difficulty: 1
    question: |
      La non-null assertion ! est toujours sûre.
    options:
      - "true"
      - "false"
    answer: false
    explanation: |
      Faux. Elle peut cacher des null.
    skills:
      - type-assertions
  - id: typescript-22-assertions-dangereuses-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après une validation runtime (Zod…), un as User est :
    options:
      - Toujours interdit
      - Plus acceptable car la forme a été vérifiée
      - Identique à aucun check
      - Obligatoire pour Zod
    answer:
      - 1
    explanation: |
      L’assertion reflète une réalité validée.
    skills:
      - type-assertions
  - id: typescript-22-assertions-dangereuses-q4
    type: multiple_choice
    difficulty: 2
    question: |
      as any pour faire taire le compilateur :
    options:
      - Est une bonne pratique
      - Est un anti-pattern qui masque les erreurs
      - Active strict
      - Remplace les tests
    answer:
      - 1
    explanation: |
      Perte totale de sécurité.
    skills:
      - type-assertions
