id: typescript-16-entity-et-value-object-quiz
kind: QUIZ
questions:
  - id: typescript-16-entity-et-value-object-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Une Entity est principalement définie par :
    options:
      - Ses seuls attributs
      - Son identité (id)
      - Son absence d’état
      - Un enum
    answer:
      - 1
    explanation: |
      L’id distingue les entités.
    skills:
      - oop
  - id: typescript-16-entity-et-value-object-q2
    type: true_false
    difficulty: 1
    question: |
      Un Value Object est souvent immuable.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, c’est une pratique courante.
    skills:
      - oop
  - id: typescript-16-entity-et-value-object-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Money, Email, Address sont typiquement des :
    options:
      - Entities
      - Value Objects
      - Enums uniquement
      - Décorateurs
    answer:
      - 1
    explanation: |
      Concepts définis par leur valeur.
    skills:
      - oop
  - id: typescript-16-entity-et-value-object-q4
    type: multiple_choice
    difficulty: 2
    question: |
      La primitive obsession consiste à :
    options:
      - Trop utiliser des value objects
      - Tout modéliser avec string/number au lieu de concepts métier
      - Interdire les classes
      - Utiliser uniquement des interfaces
    answer:
      - 1
    explanation: |
      Manque de typage métier fin.
    skills:
      - oop
