id: typescript-16-composition-quiz
kind: QUIZ
questions:
  - id: typescript-16-composition-q1
    type: multiple_choice
    difficulty: 1
    question: |
      La composition exprime plutôt une relation :
    options:
      - est-un (is-a)
      - a-un (has-a)
      - égale-à
      - ignore
    answer:
      - 1
    explanation: |
      Assemblage de parties.
    skills:
      - oop
  - id: typescript-16-composition-q2
    type: true_false
    difficulty: 1
    question: |
      La composition est souvent plus flexible que l’héritage.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - oop
  - id: typescript-16-composition-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Un signe qu’il vaut mieux composer plutôt qu’hériter :
    options:
      - Relation is-a claire et stable
      - On veut seulement réutiliser un comportement utilitaire
      - On a une seule classe dans le projet
      - On n’utilise pas TypeScript
    answer:
      - 1
    explanation: |
      Réutilisation ≠ relation d’héritage.
    skills:
      - oop
  - id: typescript-16-composition-q4
    type: multiple_choice
    difficulty: 2
    question: |
      La composition se combine naturellement avec :
    options:
      - Uniquement les enums
      - L’injection de dépendances
      - L’interdiction des interfaces
      - any partout
    answer:
      - 1
    explanation: |
      On injecte les collaborateurs.
    skills:
      - oop
