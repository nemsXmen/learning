id: typescript-41-plusieurs-parametres-quiz
kind: QUIZ
questions:
  - id: typescript-41-plusieurs-parametres-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Result<T, E = Error> a :
    options:
      - Un seul param
      - Deux params, E optionnel avec défaut
      - Zéro param
      - Uniquement des valeurs runtime
    answer:
      - 1
    explanation: |
      Défaut de type.
    skills:
      - generics
  - id: typescript-41-plusieurs-parametres-q2
    type: true_false
    difficulty: 1
    question: |
      Un type param peut être contraint par un autre (K extends keyof T).
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - generics
  - id: typescript-41-plusieurs-parametres-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Trop de paramètres génériques :
    options:
      - Est toujours plus clair
      - Peut rendre l’API difficile à utiliser
      - Est imposé
      - Active ESLint CSS
    answer:
      - 1
    explanation: |
      Lisibilité.
    skills:
      - generics
  - id: typescript-41-plusieurs-parametres-q4
    type: multiple_choice
    difficulty: 2
    question: |
      mapValues transforme les values en U en gardant :
    options:
      - Aucune clé
      - Les clés de T
      - Uniquement number keys
      - never
    answer:
      - 1
    explanation: |
      Mapped type.
    skills:
      - generics
