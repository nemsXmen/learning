id: narrowing-avec-les-unions-quiz
kind: QUIZ
questions:
  - id: typescript-08-narrowing-avec-les-unions-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Quelle technique de narrowing utilise-t-on souvent pour string | number ?
    options:
      - in
      - typeof
      - instanceof uniquement
      - delete
    answer:
      - 1
    explanation: |
      typeof est le narrowing classique pour les primitifs.
    skills:
      - unions-intersections
  - id: typescript-08-narrowing-avec-les-unions-q2
    type: true_false
    difficulty: 1
    question: |
      L’opérateur `in` peut servir à narrow des unions d’objets.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - unions-intersections
  - id: typescript-08-narrowing-avec-les-unions-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après `if (shape.kind === "circle")`, que sait TypeScript ?
    options:
      - Rien
      - Que shape a la forme du membre "circle"
      - Que shape est any
      - Que shape est never
    answer:
      - 1
    explanation: |
      Le discriminant permet le narrowing.
    skills:
      - unions-intersections
  - id: typescript-08-narrowing-avec-les-unions-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Le narrowing repose principalement sur :
    options:
      - Des casts
      - L’analyse de flux de contrôle (control-flow analysis)
      - Des décorateurs
      - Des enums uniquement
    answer:
      - 1
    explanation: |
      TypeScript analyse les branches du code.
    skills:
      - unions-intersections
