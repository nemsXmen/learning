id: types-union-quiz
kind: QUIZ
questions:
  - id: typescript-08-types-union-q1
    type: multiple_choice
    difficulty: 1
    question: >
      Que signifie `type Id = string | number` ?
    options:
      - "Id est à la fois string et number"
      - "Id peut être soit string soit number"
      - "Id est un tableau"
      - "Id est any"
    answer: [1]
    explanation: >
      L’union représente une alternative.
    skills: [unions-intersections]

  - id: typescript-08-types-union-q2
    type: true_false
    difficulty: 1
    question: >
      Sur une union, on peut accéder librement aux propriétés spécifiques de chaque membre sans narrowing.
    options:
      - "true"
      - "false"
    answer: true
    explanation: >
      Faux. Seules les opérations communes sont autorisées.
    skills: [unions-intersections]

  - id: typescript-08-types-union-q3
    type: multiple_choice
    difficulty: 2
    question: >
      Quelle opération est toujours disponible sur `string | number` ?
    options:
      - toUpperCase()
      - toFixed()
      - toString()
      - push()
    answer: [2]
    explanation: >
      toString() existe sur les deux.
    skills: [unions-intersections]

  - id: typescript-08-types-union-q4
    type: multiple_choice
    difficulty: 1
    question: >
      Le symbole de l’union est :
    options:
      - "&"
      - "|"
      - +
      - /
    answer: [1]
    explanation: >
      On utilise |.
    skills: [unions-intersections]
