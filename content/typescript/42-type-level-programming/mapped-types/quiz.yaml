id: typescript-42-mapped-types-quiz
kind: QUIZ
questions:
  - id: typescript-42-mapped-types-q1
    type: multiple_choice
    difficulty: 1
    question: |
      [K in keyof T] itère sur :
    options:
      - Les valeurs runtime
      - Les clés de T
      - Les fichiers du disque
      - process.env
    answer:
      - 1
    explanation: |
      Mapped.
    skills:
      - type-level
  - id: typescript-42-mapped-types-q2
    type: true_false
    difficulty: 1
    question: |
      -? retire le caractère optionnel des props.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - type-level
  - id: typescript-42-mapped-types-q3
    type: multiple_choice
    difficulty: 2
    question: |
      as `get${Capitalize<...>}` sert à :
    options:
      - Runtime getters auto
      - Renommer les clés au niveau des types
      - Compiler SQL
      - skipLibCheck
    answer:
      - 1
    explanation: |
      Key remapping.
    skills:
      - type-level
  - id: typescript-42-mapped-types-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Mapped sur never produit souvent :
    options:
      - string
      - "{}"
      - HTMLElement
      - un Buffer
    answer:
      - 1
    explanation: |
      Aucune clé.
    skills:
      - type-level
