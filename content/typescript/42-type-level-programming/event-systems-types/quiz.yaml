id: typescript-42-event-systems-types-quiz
kind: QUIZ
questions:
  - id: typescript-42-event-systems-types-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Une map Events sert de :
    options:
      - Source de vérité event → payload
      - Fichier CSS
      - Serveur HTTP
      - process.env
    answer:
      - 0
    explanation: |
      Contrat events.
    skills:
      - type-level
  - id: typescript-42-event-systems-types-q2
    type: true_false
    difficulty: 1
    question: |
      on<K extends keyof Events> lie le handler au payload correct.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - type-level
  - id: typescript-42-event-systems-types-q3
    type: multiple_choice
    difficulty: 2
    question: |
      event: string libre :
    options:
      - Est plus sûr
      - Perd le lien avec les payloads
      - Active infer
      - Est imposé
    answer:
      - 1
    explanation: |
      keyof Events préférable.
    skills:
      - type-level
  - id: typescript-42-event-systems-types-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Dériver onClick depuis Events via template types :
    options:
      - Est impossible
      - Est un pattern courant
      - Remplace le runtime
      - Est interdit
    answer:
      - 1
    explanation: |
      Mapped + template.
    skills:
      - type-level
