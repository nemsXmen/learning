- id: typescript-11-comprendre-never-q1
  type: multiple_choice
  difficulty: 1
  question: >
    `never` représente :
  options:
    - N’importe quelle valeur
    - L’absence de valeur possible / ce qui n’arrive jamais
    - void
    - any
  answer: [1]
  explanation: >
