- id: typescript-11-strategie-stricte-sans-any-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle option TypeScript refuse les any implicites ?
  options:
    - strictNullChecks
    - noImplicitAny
    - target
    - module
  answer: [1]
  explanation: >
    noImplicitAny fait partie du mode strict.
  skills: [any-unknown-never]

- id: typescript-11-strategie-stricte-sans-any-q2
  type: true_false
  difficulty: 1
  question: >
    ESLint peut interdire les any explicites.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, via @typescript-eslint/no-explicit-any.
  skills: [any-unknown-never]

- id: typescript-11-strategie-stricte-sans-any-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Pour les données JSON externes, la stratégie recommandée est :
  options:
    - any
    - unknown + validation / narrowing
    - Object uniquement
    - Désactiver le compilateur
  answer: [1]
  explanation: >
    On conserve la sécurité jusqu’à la preuve du type.
  skills: [any-unknown-never]

- id: typescript-11-strategie-stricte-sans-any-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Que faire des any « temporaires » restants ?
  options:
    - Les laisser sans suivi
    - Les isoler, commenter et planifier leur suppression
    - Les multiplier
    - Les convertir en never
  answer: [1]
  explanation: >
    Ils doivent rester exceptionnels et tracés.
  skills: [any-unknown-never]
