- id: typescript-11-narrowing-de-unknown-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Pour utiliser une valeur `unknown`, il faut généralement :
  options:
    - Rien de spécial
    - La narrow (typeof, type guard…)
    - La convertir en any
    - Utiliser delete
  answer: [1]
  explanation: >
    Le narrowing est obligatoire pour un usage type-safe.
  skills: [any-unknown-never]

- id: typescript-11-narrowing-de-unknown-q2
  type: true_false
  difficulty: 1
  question: >
    `typeof value === "string"` peut narrow un unknown en string.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui.
  skills: [any-unknown-never]

- id: typescript-11-narrowing-de-unknown-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quel est le risque d’un `as User` immédiat sur un unknown ?
  options:
    - Aucun
    - Mentir au compilateur sans validation runtime
    - Erreur de syntaxe
    - Conversion automatique sûre
  answer: [1]
  explanation: >
    Le cast ne valide rien à runtime.
  skills: [any-unknown-never]

- id: typescript-11-narrowing-de-unknown-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Pour des données JSON externes, une bonne approche est :
  options:
    - any partout
    - unknown + validation/narrowing (éventuellement Zod)
    - Object uniquement
    - Désactiver strict
  answer: [1]
  explanation: >
    On garde la sécurité jusqu’à la preuve du type.
  skills: [any-unknown-never]
