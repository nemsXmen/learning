    type: multiple_choice
    difficulty: 1
    question: |
      Pour activer un Client Component on ajoute :
    options:
      - '"use server" only'
      - use client
      - '"use strict" DOM'
      - skipLibCheck
    answer:
      - 1
    explanation: |
      Directive.
    skills:
      - nextjs
  - id: typescript-32-client-components-q2
    type: true_false
    difficulty: 1
    question: |
      useState fonctionne dans un Client Component.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - nextjs
  - id: typescript-32-client-components-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Importer fs dans un Client Component :
    options:
      - Est idéal
      - Est incorrect (API serveur)
      - Active les types DOM
      - Est obligatoire
    answer:
      - 1
    explanation: |
      Frontière serveur/client.
    skills:
      - nextjs
  - id: typescript-32-client-components-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Bonne pratique :
    options:
      - Tout mettre en client
      - Minimiser la surface client
      - Interdire les Server Components
      - Désactiver TypeScript
    answer:
      - 1
    explanation: |
      Perf + sécurité.
    skills:
      - nextjs
