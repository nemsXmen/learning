id: typescript-17-keyof-quiz
kind: QUIZ
questions:
  - id: typescript-17-keyof-q1
    type: multiple_choice
    difficulty: 2
    question: |
      `keyof { a: number; b: string }` produit :
    options:
      - string
      - '"a" | "b"'
      - number | string
      - any
    answer:
      - 1
    explanation: |
      Union des noms de propriétés.
    skills:
      - advanced-types
  - id: typescript-17-keyof-q2
    type: true_false
    difficulty: 2
    question: |
      `keyof (A | B)` donne les clés communes à A et B.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - advanced-types
  - id: typescript-17-keyof-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Dans `K extends keyof T`, K est restreint aux :
    options:
      - N’importe quelles strings
      - Clés de T
      - Uniquement les numbers
      - Méthodes uniquement
    answer:
      - 1
    explanation: |
      Contrainte sur les clés valides.
    skills:
      - advanced-types
  - id: typescript-17-keyof-q4
    type: multiple_choice
    difficulty: 2
    question: |
      `keyof any` est approximativement :
    options:
      - never
      - string | number | symbol
      - only string
      - undefined
    answer:
      - 1
    explanation: |
      Très large.
    skills:
      - advanced-types
