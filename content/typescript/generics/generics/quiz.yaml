id: typescript-generics-quiz
kind: QUIZ
questions:
  - id: ts-generics-q1
    type: multiple_choice
    difficulty: 2
    question: >
      Qu'exprime un générique que `any` ne saurait pas exprimer ?
    options:
      - Une relation entre le type d'entrée et le type de sortie
      - Une vérification supplémentaire à l'exécution
      - Une contrainte de performance
      - Une conversion automatique entre types
    answer: [0]
    explanation: >
      `any` désactive la vérification : le lien entre l'argument et le retour est
      perdu. `function premier<T>(l: T[]): T | undefined` dit que le type renvoyé est
      celui des éléments reçus — une relation, pas une valeur. Rien de tout cela
      n'existe à l'exécution.
    skills:
      - generics

  - id: ts-generics-q2
    type: multiple_choice
    difficulty: 3
    question: >
      Que permet `T extends { id: string }` dans le corps de la fonction ?
    options:
      - Lire `.id` sur une valeur de type T
      - Créer une instance de T avec `new`
      - Convertir T en string à l'exécution
      - Rendre T optionnel
    answer: [0]
    explanation: >
      Une contrainte définit ce que le corps a le droit de faire avec `T`. Sans elle,
      `T` pourrait être n'importe quoi et `.id` serait refusé. Elle sert donc deux
      fois : filtrer les appels invalides, et débloquer l'accès aux membres garantis.
    skills:
      - type-constraints

  - id: ts-generics-q3
    type: true_false
    difficulty: 3
    question: >
      Un paramètre de type qui n'apparaît qu'une seule fois dans une signature est
      généralement inutile.
    answer: true
    explanation: >
      Un générique existe pour relier deux positions. Utilisé une seule fois, il ne
      relie rien : `function afficher<T>(v: T): void` est strictement équivalent à
      `(v: unknown): void`, en moins lisible. C'est le « générique fantôme ».
    skills:
      - generics

  - id: ts-generics-q4
    type: predict_output
    difficulty: 4
    question: >
      Avec `function cle<T, K extends keyof T>(o: T, k: K): T[K]` et
      `const u = { nom: 'Ada', age: 36 }`, quel est le type de `cle(u, 'age')` ?
    answer: 'number'
    explanation: >
      `K` est inféré comme le littéral `'age'`, contraint par `keyof T`. Le retour
      `T[K]` vaut donc le type de la propriété `age`, soit `number`. Deux paramètres
      de type coopèrent ici pour calculer un résultat précis.
    skills:
      - generics
      - type-constraints
