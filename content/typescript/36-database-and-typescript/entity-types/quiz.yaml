id: typescript-36-entity-types-quiz
kind: QUIZ
questions:
  - id: typescript-36-entity-types-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Un entity type représente surtout :
    options:
      - Le CSS
      - La forme persistée (row)
      - Uniquement le DTO public
      - process.argv
    answer:
      - 1
    explanation: |
      Couche DB.
    skills:
      - database
  - id: typescript-36-entity-types-q2
    type: true_false
    difficulty: 1
    question: |
      Prisma génère des types TypeScript à partir du schema.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - database
  - id: typescript-36-entity-types-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après une migration, il faut souvent :
    options:
      - Rien
      - Régénérer / aligner les types
      - Supprimer TypeScript
      - Désactiver strict
    answer:
      - 1
    explanation: |
      Éviter le drift.
    skills:
      - database
  - id: typescript-36-entity-types-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Les enums SQL se mappent souvent vers :
    options:
      - any
      - Unions string ou enums TS
      - Buffer
      - HTMLElement
    answer:
      - 1
    explanation: |
      Valeurs discrètes.
    skills:
      - database
