id: typescript-28-keyboardevent-quiz
kind: QUIZ
questions:
  - id: typescript-28-keyboardevent-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Pour détecter Escape, on utilise souvent :
    options:
      - e.keyCode === 27 uniquement (moderne)
      - e.key === "Escape"
      - e.type === "mouse"
      - e.clientX
    answer:
      - 1
    explanation: |
      key sémantique.
    skills:
      - dom
  - id: typescript-28-keyboardevent-q2
    type: true_false
    difficulty: 1
    question: |
      keyCode est considéré comme déprécié au profit de key.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - dom
  - id: typescript-28-keyboardevent-q3
    type: multiple_choice
    difficulty: 2
    question: |
      e.code représente plutôt :
    options:
      - La valeur sémantique affichée
      - La touche physique
      - Un status HTTP
      - Un sélecteur CSS
    answer:
      - 1
    explanation: |
      Layout-indépendant.
    skills:
      - dom
  - id: typescript-28-keyboardevent-q4
    type: multiple_choice
    difficulty: 1
    question: |
      KeyboardEvent étend :
    options:
      - UIEvent / Event
      - HTMLElement
      - Document
      - Promise
    answer:
      - 0
    explanation: |
      Hiérarchie d’events.
    skills:
      - dom
