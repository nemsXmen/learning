    difficulty: 2
    question: |
      À runtime, le paramètre T d’une fonction générique :
    options:
      - Existe comme objet
      - Est effacé
      - Devient une classe
      - Valide Zod auto
    answer:
      - 1
    explanation: |
      Type erasure.
    skills:
      - testing
