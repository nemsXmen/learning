    type: multiple_choice
    difficulty: 1
    question: |
      vi.spyOn sert à :
    options:
      - Compiler
      - Observer/stubber une méthode
      - Créer une DB
      - Minifier le CSS
    answer:
      - 1
    explanation: |
      Spy.
    skills:
      - testing
