id: typescript-20-conditional-types-simples-quiz
kind: QUIZ
questions:
  - id: typescript-20-conditional-types-simples-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Un conditional type choisit un type selon :
    options:
      - Une valeur runtime
      - Une condition d’assignabilité compile-time
      - Un random
      - Un fichier de config
    answer:
      - 1
    explanation: |
      Pure type-level.
    skills:
      - conditional-types
  - id: typescript-20-conditional-types-simples-q2
    type: true_false
    difficulty: 1
    question: |
      On peut brancher sur T extends Error pour distinguer succès / erreur.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - conditional-types
  - id: typescript-20-conditional-types-simples-q3
    type: multiple_choice
    difficulty: 2
    question: |
      `T extends any[] ? true : false` pour T = string[] vaut :
    options:
      - "false"
      - "true"
      - string[]
      - never
    answer:
      - 1
    explanation: |
      string[] extends any[].
    skills:
      - conditional-types
  - id: typescript-20-conditional-types-simples-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Les conditional types sont évalués :
    options:
      - À runtime
      - À la compilation
      - Uniquement au deploy
      - Dans le navigateur seulement
    answer:
      - 1
    explanation: |
      Compile-time.
    skills:
      - conditional-types
