- id: typescript-09-number-literal-types-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Que représente `type Dice = 1 | 2 | 3 | 4 | 5 | 6` ?
  options:
    - N’importe quel number
    - Uniquement les entiers de 1 à 6
    - Un tableau
    - Un string
  answer: [1]
  explanation: >
    C’est une union de number literal types.
  skills: [literal-types]

- id: typescript-09-number-literal-types-q2
  type: true_false
  difficulty: 1
  question: >
    On peut assigner 7 à une variable de type Dice (1|2|3|4|5|6).
  options:
    - "true"
    - "false"
  answer: [1]
  explanation: >
    Faux. 7 n’est pas dans l’union.
  skills: [literal-types]

- id: typescript-09-number-literal-types-q3
  type: multiple_choice
  difficulty: 1
  question: >
    Un number literal type est un sous-type de :
  options:
    - string
    - number
    - boolean
    - object
  answer: [1]
  explanation: >
    Oui, comme les string literals sont des sous-types de string.
  skills: [literal-types]

- id: typescript-09-number-literal-types-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Quel est un bon cas d’usage des number literal types ?
  options:
    - Tous les calculs flottants
    - Codes HTTP, ports, niveaux discrets
    - Remplacer bigint
    - Désactiver le typage
  answer: [1]
  explanation: >
    Les ensembles fermés de nombres sont le cas d’usage idéal.
  skills: [literal-types]
