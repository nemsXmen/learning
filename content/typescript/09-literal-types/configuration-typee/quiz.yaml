- id: typescript-09-configuration-typee-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Pourquoi typer une config avec des literal unions plutôt qu’avec string ?
  options:
    - Pour accélérer le runtime
    - Pour restreindre et documenter les valeurs autorisées
    - Parce que string est interdit
    - Pour créer des classes
  answer: [1]
  explanation: >
    On évite les configs « stringly typed ».
  skills: [literal-types]

- id: typescript-09-configuration-typee-q2
  type: true_false
  difficulty: 1
  question: >
    `as const` sur un objet de config fige les types des valeurs.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui.
  skills: [literal-types]

- id: typescript-09-configuration-typee-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quel pattern est courant pour dériver le type d’une config constante ?
  options:
    - any
    - typeof config (souvent après as const)
    - new Config()
    - enum uniquement
  answer: [1]
  explanation: >
    typeof permet de récupérer le type de la valeur.
  skills: [literal-types]

- id: typescript-09-configuration-typee-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Les literal types sur une config protègent-ils à runtime ?
  options:
    - Oui complètement
    - Non (il faut une validation runtime pour les données externes)
    - Uniquement en mode strict
    - Uniquement avec des classes
  answer: [1]
  explanation: >
    Les types sont effacés ; la validation runtime reste nécessaire aux frontières.
  skills: [literal-types]
