id: typescript-31-usememo-quiz
kind: QUIZ
questions:
  - id: typescript-31-usememo-q1
    type: multiple_choice
    difficulty: 1
    question: |
      useMemo sert surtout à :
    options:
      - Typer les props
      - Mémoriser une valeur calculée
      - Remplacer useState
      - Configurer tsconfig
    answer:
      - 1
    explanation: |
      Mémoisation.
    skills:
      - react
  - id: typescript-31-usememo-q2
    type: true_false
    difficulty: 1
    question: |
      Le type de retour de useMemo est souvent inféré.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - react
  - id: typescript-31-usememo-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Abuser de useMemo :
    options:
      - Est toujours un gain
      - Peut complexifier sans bénéfice
      - Est imposé par TypeScript
      - Remplace les tests
    answer:
      - 1
    explanation: |
      Mesurer d’abord.
    skills:
      - react
  - id: typescript-31-usememo-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Les deps de useMemo doivent :
    options:
      - Être vides toujours
      - Inclure les valeurs utilisées
      - Être any
      - Être des CSS classes
    answer:
      - 1
    explanation: |
      Même logique que useEffect.
    skills:
      - react
