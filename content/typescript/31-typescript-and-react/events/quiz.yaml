id: typescript-31-events-quiz
kind: QUIZ
questions:
  - id: typescript-31-events-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Pour un input onChange, on utilise souvent :
    options:
      - React.MouseEvent
      - React.ChangeEvent<HTMLInputElement>
      - EventEmitter
      - KeyboardEvent only always
    answer:
      - 1
    explanation: |
      Change events.
    skills:
      - react
