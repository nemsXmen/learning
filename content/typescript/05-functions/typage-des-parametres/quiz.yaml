- id: typescript-05-typage-des-parametres-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est la syntaxe correcte pour typer un paramètre ?
  options:
    - function f(Type name)
    - function f(name: Type)
    - function f(name = Type)
    - function f(name as Type)
  answer: [1]
  explanation: >
    On place `: Type` après le nom du paramètre.
  skills: [functions]

- id: typescript-05-typage-des-parametres-q2
  type: true_false
  difficulty: 1
  question: >
    En mode strict avec noImplicitAny, un paramètre non annoté provoque une erreur.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, TypeScript exige alors une annotation ou un contexte suffisant.
  skills: [functions]

- id: typescript-05-typage-des-parametres-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Pourquoi les paramètres sont-ils une frontière importante à typer ?
  options:
    - Parce qu’ils n’ont pas d’inférence possible
    - Parce qu’ils définissent le contrat d’entrée de la fonction
    - Uniquement pour les fonctions async
    - Pour activer le mode strict
  answer: [1]
  explanation: >
    Ils font partie de l’API publique de la fonction.
  skills: [functions]

- id: typescript-05-typage-des-parametres-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Que se passe-t-il si on passe un argument du mauvais type ?
  options:
    - Rien
    - Erreur de compilation
    - Conversion automatique
    - Erreur uniquement à runtime
  answer: [1]
  explanation: >
    TypeScript signale l’incompatibilité à la compilation.
  skills: [functions]
