- id: typescript-05-void-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Que signifie un type de retour `void` ?
  options:
    - La fonction retourne null
    - La fonction ne produit pas de valeur utile pour l’appelant
    - La fonction ne se termine jamais
    - La fonction retourne any
  answer: [1]
  explanation: >
    void signale l’absence de valeur de retour utile.
  skills: [functions]

- id: typescript-05-void-q2
  type: true_false
  difficulty: 1
  question: >
    Une fonction `: void` peut faire `return 42`.
  options:
    - "true"
    - "false"
  answer: [1]
  explanation: >
    Faux. TypeScript refuse de retourner une valeur concrète.
  skills: [functions]

- id: typescript-05-void-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quelle est la différence entre void et never ?
  options:
    - Aucune
    - void = pas de valeur utile ; never = la fonction ne se termine jamais
    - never est plus ancien
    - void est réservé aux variables
  answer: [1]
  explanation: >
    C’est la distinction clé.
  skills: [functions]

- id: typescript-05-void-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Quel type de retour est idiomatique pour une fonction de logging ?
  options:
    - any
    - undefined
    - void
    - never
  answer: [2]
  explanation: >
    void est le choix standard.
  skills: [functions]
