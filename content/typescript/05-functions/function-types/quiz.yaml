- id: typescript-05-function-types-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est la syntaxe d’un function type qui prend un string et retourne un number ?
  options:
    - string => number
    - (s: string) => number
    - function(s: string): number
    - (s: string) -> number
  answer: [1]
  explanation: >
    La forme standard est (params) => ReturnType.
  skills: [functions]

- id: typescript-05-function-types-q2
  type: true_false
  difficulty: 1
  question: >
    On peut nommer un function type avec un type alias.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, c’est même recommandé pour la réutilisation.
  skills: [functions]

- id: typescript-05-function-types-q3
  type: multiple_choice
  difficulty: 2
  question: >
    À quoi servent principalement les function types ?
  options:
    - À exécuter du code
    - À décrire des signatures de fonctions réutilisables (callbacks, stratégies…)
    - À remplacer les classes
    - À désactiver le typage
  answer: [1]
  explanation: >
    Ils servent de contrats pour les valeurs de type fonction.
  skills: [functions]

- id: typescript-05-function-types-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Peut-on exprimer un function type via une interface ?
  options:
    - Non
    - Oui, avec une call signature
    - Uniquement avec des classes
    - Uniquement en mode non-strict
  answer: [1]
  explanation: >
    Oui : interface Fn { (x: number): string; }
  skills: [functions]
