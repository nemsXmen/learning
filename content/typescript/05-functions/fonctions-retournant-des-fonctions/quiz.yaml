id: fonctions-retournant-des-fonctions-quiz
kind: QUIZ
questions:
  - id: typescript-05-fonctions-retournant-des-fonctions-q1
    type: multiple_choice
    difficulty: 1
    question: >
      Comment annote-t-on une fonction qui retourne une fonction (string) => number ?
    options:
      - ": string => number"
      - ": (s: string) => number"
      - ": Function"
      - ": any"
    answer: [1]
    explanation: >
      On utilise un function type comme type de retour.
    skills: [functions]

  - id: typescript-05-fonctions-retournant-des-fonctions-q2
    type: true_false
    difficulty: 1
    question: >
      Les closures (capture de variables) fonctionnent avec le typage TypeScript.
    options:
      - "true"
      - "false"
    answer: false
    explanation: >
      Oui, TypeScript suit correctement les types capturés.
    skills: [functions]

  - id: typescript-05-fonctions-retournant-des-fonctions-q3
    type: multiple_choice
    difficulty: 2
    question: >
      `createGreeter("Hello")` qui retourne une fonction est un exemple de :
    options:
      - Classe
      - Factory / higher-order function
      - Tuple
      - Enum
    answer: [1]
    explanation: >
      C’est une factory qui retourne une fonction configurée.
    skills: [functions]

  - id: typescript-05-fonctions-retournant-des-fonctions-q4
    type: multiple_choice
    difficulty: 1
    question: >
      Pourquoi annoter le type de retour quand on retourne une fonction ?
    options:
      - Ce n’est jamais utile
      - Pour documenter clairement la signature de la fonction retournée
      - Uniquement pour les async
      - Pour activer strict
    answer: [1]
    explanation: >
      Cela clarifie le contrat pour les utilisateurs de la factory.
    skills: [functions]
