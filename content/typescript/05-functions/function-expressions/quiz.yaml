- id: typescript-05-function-expressions-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est une function expression valide ?
  options:
    - function add(a, b) { return a + b; }
    - const add = function (a: number, b: number) { return a + b; }
    - add = function
    - function = add
  answer: [1]
  explanation: >
    On assigne une fonction anonyme (ou nommée) à une variable.
  skills: [functions]

- id: typescript-05-function-expressions-q2
  type: true_false
  difficulty: 1
  question: >
    Les function expressions sont hoistées comme les function declarations.
  options:
    - "true"
    - "false"
  answer: [1]
  explanation: >
    Faux. Elles suivent le comportement de la variable (const/let).
  skills: [functions]

- id: typescript-05-function-expressions-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Peut-on typer la variable qui reçoit une function expression ?
  options:
    - Non
    - Oui, avec un function type (ex. (a: number) => number)
    - Uniquement avec any
    - Uniquement en mode non-strict
  answer: [1]
  explanation: >
    Oui, et cela permet souvent d’alléger les annotations internes grâce au contextual typing.
  skills: [functions]

- id: typescript-05-function-expressions-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Dans quel cas utilise-t-on souvent des function expressions ?
  options:
    - Uniquement pour les programmes entiers
    - Pour les callbacks, les assignations et les valeurs de retour de fonctions
    - Pour remplacer les classes
    - Pour désactiver le typage
  answer: [1]
  explanation: >
    Elles sont très courantes dès qu’une fonction est traitée comme une valeur.
  skills: [functions]
