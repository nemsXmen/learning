- id: typescript-05-parametres-rest-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est la syntaxe d’un paramètre rest typé ?
  options:
    - ...args: number
    - ...args: number[]
    - args...: number[]
    - rest args: number[]
  answer: [1]
  explanation: >
    On écrit ...name: Type[].
  skills: [functions]

- id: typescript-05-parametres-rest-q2
  type: true_false
  difficulty: 1
  question: >
    Le paramètre rest doit être le dernier de la liste.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, c’est une règle stricte.
  skills: [functions]

- id: typescript-05-parametres-rest-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Que contient le paramètre rest à l’intérieur de la fonction ?
  options:
    - Une string
    - Un tableau des arguments restants
    - Un objet
    - undefined
  answer: [1]
  explanation: >
    C’est un tableau typé.
  skills: [functions]

- id: typescript-05-parametres-rest-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Peut-on avoir plusieurs paramètres rest dans une même fonction ?
  options:
    - Oui
    - Non
    - Uniquement en mode strict
    - Uniquement avec des tuples
  answer: [1]
  explanation: >
    Non, un seul rest parameter est autorisé.
  skills: [functions]
