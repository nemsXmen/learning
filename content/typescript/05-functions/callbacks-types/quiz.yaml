- id: typescript-05-callbacks-types-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est une bonne façon de typer un callback qui prend un number et retourne un boolean ?
  options:
    - callback: Function
    - callback: (n: number) => boolean
    - callback: any
    - callback: boolean
  answer: [1]
  explanation: >
    Un function type précis est la bonne approche.
  skills: [functions]

- id: typescript-05-callbacks-types-q2
  type: true_false
  difficulty: 1
  question: >
    Le contextual typing peut alléger les annotations des callbacks côté appelant.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, TypeScript infère souvent les types des paramètres du callback.
  skills: [functions]

- id: typescript-05-callbacks-types-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Pourquoi éviter de typer un callback en `any` ou `Function` ?
  options:
    - Parce que c’est plus long à écrire
    - Parce qu’on perd la sécurité et l’autocomplétion
    - Parce que TypeScript l’interdit
    - Parce que ça ne compile pas
  answer: [1]
  explanation: >
    On perd tous les bénéfices du typage.
  skills: [functions]

- id: typescript-05-callbacks-types-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Que décrit le type `(item: string) => void` ?
  options:
    - Une fonction qui prend un string et ne retourne rien d’utile
    - Une variable string
    - Un tableau de strings
    - Une fonction qui retourne un string
  answer: [0]
  explanation: >
    C’est la signature d’un callback classique.
  skills: [functions]
