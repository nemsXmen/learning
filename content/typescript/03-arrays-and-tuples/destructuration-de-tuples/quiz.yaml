id: destructuration-de-tuples-quiz
kind: QUIZ
questions:
  - id: typescript-03-destructuration-de-tuples-q1
    type: multiple_choice
    difficulty: 1
    question: >
      Après `const [name, age] = ["Alice", 30] as [string, number];`, quel est
      le type de name ?
    options:
      - any
      - string
      - string | number
      - unknown
    answer:
      - 1
    explanation: |
      La destructuration propage le type de la position 0.
    skills:
      - arrays-tuples
  - id: typescript-03-destructuration-de-tuples-q2
    type: true_false
    difficulty: 1
    question: |
      On peut utiliser le rest (`...`) dans la destructuration d’un tuple.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, exactement comme avec les tableaux.
    skills:
      - arrays-tuples
  - id: typescript-03-destructuration-de-tuples-q3
    type: multiple_choice
    difficulty: 2
    question: >
      Que donne `const [label, ...rest] = ["a", 1, 2, 3] as [string,
      ...number[]];` pour rest ?
    options:
      - number
      - number[]
      - (string | number)[]
      - any[]
    answer:
      - 1
    explanation: |
      Le rest capture les number restants sous forme de number[].
    skills:
      - arrays-tuples
  - id: typescript-03-destructuration-de-tuples-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Pourquoi la destructuration de tuples est-elle pratique ?
    options:
      - Elle désactive le typage
      - Elle permet d’extraire des valeurs avec leurs types exacts de façon
        lisible
      - Elle convertit le tuple en objet
      - Elle est obligatoire
    answer:
      - 1
    explanation: |
      On obtient des variables correctement typées avec une syntaxe claire.
    skills:
      - arrays-tuples
