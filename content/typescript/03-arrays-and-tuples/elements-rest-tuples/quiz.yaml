- id: typescript-03-elements-rest-tuples-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est la syntaxe d’un élément rest dans un tuple ?
  options:
    - [string, number...]
    - [string, ...number[]]
    - [string, rest number]
    - [string, number[]]
  answer: [1]
  explanation: >
    On utilise ...Type[] en dernière position.
  skills: [arrays-tuples]

- id: typescript-03-elements-rest-tuples-q2
  type: true_false
  difficulty: 1
  question: >
    L’élément rest peut être placé au milieu d’un tuple.
  options:
    - "true"
    - "false"
  answer: [1]
  explanation: >
    Faux. Il doit être en dernière position.
  skills: [arrays-tuples]

- id: typescript-03-elements-rest-tuples-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Que permet `[string, ...boolean[]]` ?
  options:
    - Exactement deux éléments
    - Un string suivi de zéro ou plusieurs booleans
    - Uniquement des booleans
    - Un string et un seul boolean
  answer: [1]
  explanation: >
    La partie rest accepte 0..n booleans.
  skills: [arrays-tuples]

- id: typescript-03-elements-rest-tuples-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Peut-on avoir un élément optionnel après un rest ?
  options:
    - Oui
    - Non
    - Uniquement en mode non-strict
    - Uniquement avec des labels
  answer: [1]
  explanation: >
    Non. Le rest doit être le dernier élément.
  skills: [arrays-tuples]
