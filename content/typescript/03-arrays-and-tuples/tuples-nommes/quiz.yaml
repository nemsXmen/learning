- id: typescript-03-tuples-nommes-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Que permet un tuple nommé comme `[x: number, y: number]` ?
  options:
    - D’accéder via p.x à runtime
    - D’améliorer la lisibilité et l’autocomplétion au niveau des types
    - De créer un objet
    - Rien de spécial
  answer: [1]
  explanation: >
    Les labels sont purement informatifs pour TypeScript et l’éditeur.
  skills: [arrays-tuples]

- id: typescript-03-tuples-nommes-q2
  type: true_false
  difficulty: 1
  question: >
    On peut écrire `point.x` si point est de type `[x: number, y: number]`.
  options:
    - "true"
    - "false"
  answer: [1]
  explanation: >
    Faux. L’accès reste point[0]. Les labels n’existent pas à runtime.
  skills: [arrays-tuples]

- id: typescript-03-tuples-nommes-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Les labels de tuples nommés existent-ils dans le JavaScript généré ?
  options:
    - Oui
    - Non
    - Uniquement en mode strict
    - Uniquement avec esbuild
  answer: [1]
  explanation: >
    Non, ils sont effacés comme toutes les annotations de types.
  skills: [arrays-tuples]

- id: typescript-03-tuples-nommes-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle est la syntaxe correcte d’un tuple nommé ?
  options:
    - [x = number, y = number]
    - [x: number, y: number]
    - {x: number, y: number}
    - (x: number, y: number)
  answer: [1]
  explanation: >
    On utilise label: Type à l’intérieur des crochets.
  skills: [arrays-tuples]
