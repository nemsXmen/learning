id: typescript-24-export-type-quiz
kind: QUIZ
questions:
  - id: typescript-24-export-type-q1
    type: multiple_choice
    difficulty: 1
    question: |
      export type indique que l’export est :
    options:
      - Une valeur runtime
      - Uniquement un type
      - Un CSS module
      - Un test
    answer:
      - 1
    explanation: |
      Type-only.
    skills:
      - modules
  - id: typescript-24-export-type-q2
    type: true_false
    difficulty: 1
    question: |
      Les export type sont effacés à la compilation.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - modules
  - id: typescript-24-export-type-q3
    type: multiple_choice
    difficulty: 2
    question: |
      export type est particulièrement utile avec :
    options:
      - Les fichiers CSS uniquement
      - isolatedModules / bundlers stricts
      - Les enums runtime uniquement
      - Désactiver TypeScript
    answer:
      - 1
    explanation: |
      Séparation claire type/valeur.
    skills:
      - modules
  - id: typescript-24-export-type-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Exporter une classe en export type puis faire new :
    options:
      - Fonctionne toujours
      - '{"Échoue":"pas de valeur runtime exportée"}'
      - Active strict
      - Convertit en interface
    answer:
      - 1
    explanation: |
      class comme valeur n’est pas exportée.
    skills:
      - modules
