id: typescript-type-inference-quiz
kind: QUIZ
questions:
  - id: ts-inference-q1
    type: multiple_choice
    difficulty: 2
    question: >
      Quel est le type de `nom` dans `const nom = 'ada'` ?
    options:
      - Le type littéral `'ada'`
      - "`string`"
      - "`any`"
      - "`readonly string`"
    answer: [0]
    explanation: >
      Une liaison `const` ne pouvant jamais être réaffectée, TypeScript conserve le
      type littéral. Avec `let`, le type est élargi à `string`, puisque la variable
      doit pouvoir accueillir n'importe quelle chaîne.
    skills:
      - type-inference

  - id: ts-inference-q2
    type: true_false
    difficulty: 2
    question: >
      Dans `const config = { mode: 'sombre' }`, la propriété `mode` a le type
      littéral `'sombre'`.
    answer: false
    explanation: >
      Les propriétés d'objet sont toujours élargies, même dans un `const` : `mode` a
      le type `string`. C'est précisément le cas où `as const` devient nécessaire, par
      exemple pour passer la valeur à une fonction attendant `'sombre' | 'clair'`.
    skills:
      - type-inference
      - primitive-types

  - id: ts-inference-q3
    type: multiple_choice
    difficulty: 3
    question: >
      Que fait l'opérateur `as` ?
    options:
      - Il affirme un type sans aucune vérification à l'exécution
      - Il convertit la valeur vers le type demandé
      - Il vérifie le type à l'exécution et lève une erreur si besoin
      - Il élargit le type inféré
    answer: [0]
    explanation: >
      `as` est une affirmation adressée au compilateur, pas une conversion : rien
      n'est vérifié à l'exécution et aucun code n'est généré. Utilisé pour faire taire
      une erreur mal comprise, il ne supprime que le message — jamais le bug.
    skills:
      - type-inference

  - id: ts-inference-q4
    type: multiple_answer
    difficulty: 3
    question: >
      Dans quels cas une annotation explicite est-elle justifiée ?
    options:
      - Sur les paramètres d'une fonction
      - Pour contraindre une valeur à une union plus étroite que l'inférence
      - Sur `const age = 30`, pour documenter que c'est un nombre
      - Sur le type de retour d'une fonction dont le corps est trivial
    answer: [0, 1]
    explanation: >
      Les paramètres ne sont jamais inférés depuis les appels : sans annotation ils
      valent `any` implicite, que `strict` refuse. Contraindre une union est l'autre
      cas utile. En revanche répéter ce que le compilateur sait déjà n'apporte rien et
      empêche parfois une inférence plus fine.
    skills:
      - type-inference
