- id: typescript-02-never-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Que représente le type `never` ?
  options:
    - Une valeur nulle
    - Des valeurs qui n’arrivent jamais
    - L’absence de type
    - Un synonyme de void
  answer: [1]
  explanation: >
    never est le type des valeurs qui ne peuvent pas se produire.
  skills: [primitive-types]

- id: typescript-02-never-q2
  type: true_false
  difficulty: 1
  question: >
    Une fonction qui fait `throw new Error()` peut être typée comme retournant `never`.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, car elle ne retourne jamais normalement.
  skills: [primitive-types]

- id: typescript-02-never-q3
  type: multiple_choice
  difficulty: 2
  question: >
    À quoi sert souvent le pattern `assertNever` ?
  options:
    - À convertir any en string
    - À vérifier l’exhaustivité d’un switch sur une union
    - À désactiver le type-checking
    - À créer des symboles
  answer: [1]
  explanation: >
    Si un cas d’une union n’est pas géré, TypeScript errora car la valeur n’est pas de type never.
  skills: [primitive-types]

- id: typescript-02-never-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Quelle affirmation est correcte ?
  options:
    - never et void sont identiques
    - void signifie « pas de valeur utile », never signifie « n’arrive jamais »
    - never est assignable uniquement à any
    - void est le type bottom
  answer: [1]
  explanation: >
    void = pas de retour utile. never = la fonction ne se termine jamais normalement.
  skills: [primitive-types]
