- id: typescript-02-number-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Combien de types numériques primitifs TypeScript possède-t-il (hors bigint) ?
  options:
    - Deux : int et float
    - Un seul : number
    - Trois : int, float et decimal
    - Aucun, tout est any
  answer: [1]
  explanation: >
    Il n’y a qu’un type number, qui couvre entiers et flottants.
  skills: [primitive-types]

- id: typescript-02-number-q2
  type: true_false
  difficulty: 1
  question: >
    NaN est de type number en TypeScript.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui. NaN appartient au type number, comme en JavaScript.
  skills: [primitive-types]

- id: typescript-02-number-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quelle est la bonne façon de déclarer un nombre ?
  options:
    - let n: Number = 42
    - let n: number = 42
    - let n: int = 42
    - let n: float = 42
  answer: [1]
  explanation: >
    On utilise le primitif number (minuscule). Number est l’objet wrapper.
  skills: [primitive-types]

- id: typescript-02-number-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Que retourne l’expression 0.1 + 0.2 en JavaScript/TypeScript ?
  options:
    - Exactement 0.3
    - Une valeur très proche de 0.3 mais pas exactement 0.3 (problème de précision flottante)
    - Une erreur de compilation
    - NaN
  answer: [1]
  explanation: >
    C’est le comportement classique des flottants IEEE 754. Pour l’argent on utilise des bibliothèques spécialisées ou des entiers (centimes).
  skills: [primitive-types]
