id: null-quiz
kind: QUIZ
questions:
  - id: typescript-02-null-q1
    type: multiple_choice
    difficulty: 1
    question: >
      Avec strictNullChecks activé, que se passe-t-il avec `let name: string =
      null;` ?
    options:
      - Ça compile
      - Erreur de compilation
      - null est converti en ""
      - TypeScript ignore null
    answer:
      - 1
    explanation: |
      null n’est pas assignable à string. Il faut string | null.
    skills:
      - primitive-types
  - id: typescript-02-null-q2
    type: true_false
    difficulty: 1
    question: |
      null représente l’absence intentionnelle de valeur.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui. C’est la définition classique de null.
    skills:
      - primitive-types
  - id: typescript-02-null-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Comment déclarer une variable qui peut être une string ou null ?
    options:
      - '{"let x":"string = null"}'
      - '{"let x":"string | null = null"}'
      - '{"let x":"string? = null"}'
      - '{"let x":"nullable string"}'
    answer:
      - 1
    explanation: |
      On utilise une union de types : string | null.
    skills:
      - primitive-types
  - id: typescript-02-null-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Pourquoi active-t-on généralement strictNullChecks ?
    options:
      - Pour rendre le compilateur plus rapide
      - Pour forcer la gestion explicite de null et éviter beaucoup d’erreurs
        runtime
      - Pour interdire complètement null
      - Pour activer les template literal types
    answer:
      - 1
    explanation: >
      Cela oblige à traiter null de façon intentionnelle et réduit les crashs du
      type "Cannot read properties of null".
    skills:
      - primitive-types
