- id: typescript-02-string-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quel est le type primitif correct pour une chaîne de caractères en TypeScript ?
  options:
    - String
    - string
    - text
    - str
  answer: [1]
  explanation: >
    On utilise le type primitif `string` (minuscule). `String` est l’objet wrapper, à éviter.
  skills: [primitive-types]

- id: typescript-02-string-q2
  type: true_false
  difficulty: 1
  question: >
    Les template literals (backticks) sont parfaitement supportés par le type string.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui. `` `Hello ${name}` `` est de type string.
  skills: [primitive-types]

- id: typescript-02-string-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Que se passe-t-il avec `let name: string = null;` en mode strictNullChecks ?
  options:
    - Ça compile sans problème
    - Erreur : Type 'null' is not assignable to type 'string'
    - null est automatiquement converti en ""
    - TypeScript ignore l’annotation
  answer: [1]
  explanation: >
    En mode strict, null n’est pas assignable à string. Il faut string | null si on veut accepter null.
  skills: [primitive-types]

- id: typescript-02-string-q4
  type: multiple_choice
  difficulty: 2
  question: >
    Pourquoi préfère-t-on `string` à `String` ?
  options:
    - Parce que String est plus lent
    - Parce que string est le primitif et String est l’objet wrapper, source de confusions
    - Parce que String n’existe pas en TypeScript
    - Parce que string est réservé aux template literals
  answer: [1]
  explanation: >
    Le primitif string est le type standard. L’objet String est rarement utile et peut surprendre (ex. comparaisons).
  skills: [primitive-types]
