id: undefined-quiz
kind: QUIZ
questions:
  - id: typescript-02-undefined-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Que signifie généralement `undefined` ?
    options:
      - Une erreur de compilation
      - Une variable déclarée mais non encore assignée, ou une valeur absente
      - Une chaîne vide
      - Un nombre égal à zéro
    answer:
      - 1
    explanation: |
      undefined indique l’absence de valeur assignée.
    skills:
      - primitive-types
  - id: typescript-02-undefined-q2
    type: true_false
    difficulty: 1
    question: |
      Avec strictNullChecks, `let x: string = undefined;` provoque une erreur.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui. Il faut string | undefined.
    skills:
      - primitive-types
  - id: typescript-02-undefined-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Quel est le type d’un paramètre optionnel `name?: string` ?
    options:
      - string
      - string | null
      - string | undefined
      - any
    answer:
      - 2
    explanation: |
      Le `?` ajoute automatiquement | undefined.
    skills:
      - primitive-types
  - id: typescript-02-undefined-q4
    type: multiple_choice
    difficulty: 2
    question: >
      Que se passe-t-il si on utilise une variable déclarée mais non initialisée
      ?
    options:
      - Elle vaut automatiquement null
      - TypeScript signale une erreur (used before being assigned)
      - Elle vaut 0
      - Aucune vérification
    answer:
      - 1
    explanation: |
      TypeScript empêche l’utilisation d’une variable avant son initialisation.
    skills:
      - primitive-types
