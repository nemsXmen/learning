- id: typescript-02-boolean-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Quelles valeurs le type boolean accepte-t-il ?
  options:
    - true, false, 0 et 1
    - Uniquement true et false
    - true, false et null
    - N’importe quelle valeur truthy ou falsy
  answer: [1]
  explanation: >
    Le type boolean est strict : uniquement true et false.
  skills: [primitive-types]

- id: typescript-02-boolean-q2
  type: true_false
  difficulty: 1
  question: >
    TypeScript accepte d’écrire `let flag: boolean = 1;`
  options:
    - "true"
    - "false"
  answer: [1]
  explanation: >
    Faux. 1 est un number, pas un boolean.
  skills: [primitive-types]

- id: typescript-02-boolean-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quelle est la différence entre le type boolean et le concept truthy/falsy de JavaScript ?
  options:
    - Aucune différence
    - boolean n’accepte que true/false, tandis que truthy/falsy concerne de nombreuses valeurs
    - boolean accepte plus de valeurs que truthy
    - truthy n’existe qu’en TypeScript
  answer: [1]
  explanation: >
    En JavaScript beaucoup de valeurs sont falsy. En TypeScript, le type boolean est strictement true | false.
  skills: [primitive-types]

- id: typescript-02-boolean-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Quelle annotation est correcte ?
  options:
    - let ok: Boolean = true
    - let ok: boolean = true
    - let ok: bool = true
    - let ok: Truthy = true
  answer: [1]
  explanation: >
    On utilise le primitif boolean (minuscule).
  skills: [primitive-types]
