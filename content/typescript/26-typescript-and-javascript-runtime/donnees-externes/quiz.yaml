id: typescript-26-donnees-externes-quiz
kind: QUIZ
questions:
  - id: typescript-26-donnees-externes-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Une réponse HTTP est une donnée :
    options:
      - Interne garantie par TS
      - Externe à valider
      - Uniquement un type
      - Un enum
    answer:
      - 1
    explanation: |
      Frontière réseau.
    skills:
      - runtime
  - id: typescript-26-donnees-externes-q2
    type: true_false
    difficulty: 1
    question: |
      localStorage fournit des données à traiter comme externes.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - runtime
  - id: typescript-26-donnees-externes-q3
    type: multiple_choice
    difficulty: 2
    question: |
      La validation devrait idéalement se faire :
    options:
      - Au milieu du domaine seulement
      - Aux frontières (adapters)
      - Uniquement dans les tests
      - Jamais
    answer:
      - 1
    explanation: |
      Protéger le cœur métier.
    skills:
      - runtime
  - id: typescript-26-donnees-externes-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Faire confiance au backend sans contrat :
    options:
      - Est toujours sûr
      - Reste risqué sans validation / contrat partagé
      - Remplace TypeScript
      - Active strict
    answer:
      - 1
    explanation: |
      Les contrats évoluent et cassent.
    skills:
      - runtime
