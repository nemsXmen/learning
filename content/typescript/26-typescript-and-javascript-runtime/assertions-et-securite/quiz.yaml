id: typescript-26-assertions-et-securite-quiz
kind: QUIZ
questions:
  - id: typescript-26-assertions-et-securite-q1
    type: multiple_choice
    difficulty: 1
    question: |
      as User sur JSON.parse :
    options:
      - Valide les champs
      - N’ajoute aucun check runtime
      - Est une validation Zod
      - Active strict
    answer:
      - 1
    explanation: |
      Assertion pure.
    skills:
      - runtime
  - id: typescript-26-assertions-et-securite-q2
    type: true_false
    difficulty: 1
    question: |
      Préférer unknown + validation à as T sur des données externes.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - runtime
  - id: typescript-26-assertions-et-securite-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après Zod.parse réussi, une assertion supplémentaire est souvent :
    options:
      - Obligatoire
      - Redondante
      - Interdite
      - Plus lente à compile
    answer:
      - 1
    explanation: |
      Le schema a déjà typé.
    skills:
      - runtime
  - id: typescript-26-assertions-et-securite-q4
    type: multiple_choice
    difficulty: 2
    question: |
      La sécurité runtime vient de :
    options:
      - Uniquement du compilateur TS
      - Du code JS de validation / guards
      - Du tsconfig seul
      - Des interfaces
    answer:
      - 1
    explanation: |
      Exécuté réellement.
    skills:
      - runtime
