id: typescript-15-proprietes-quiz
kind: QUIZ
questions:
  - id: typescript-15-proprietes-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Une propriété optionnelle se déclare avec :
    options:
      - '{"name":"string?"}'
      - '{"name?":"string"}'
      - '{"optional name":"string"}'
      - '{"name":"string | optional"}'
    answer:
      - 1
    explanation: |
      ? après le nom.
    skills:
      - classes
  - id: typescript-15-proprietes-q2
    type: true_false
    difficulty: 1
    question: |
      Avec strictPropertyInitialization, une propriété obligatoire doit être initialisée.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - classes
  - id: typescript-15-proprietes-q3
    type: multiple_choice
    difficulty: 2
    question: |
      L’assertion `name!: string` signifie :
    options:
      - name est optionnel
      - name sera assigné ailleurs (definite assignment)
      - name est private
      - name est readonly
    answer:
      - 1
    explanation: |
      On affirme l’initialisation ultérieure.
    skills:
      - classes
  - id: typescript-15-proprietes-q4
    type: multiple_choice
    difficulty: 1
    question: |
      On peut initialiser une propriété :
    options:
      - Uniquement dans le constructeur
      - À la déclaration et/ou dans le constructeur
      - Uniquement à la déclaration
      - Uniquement au runtime via any
    answer:
      - 1
    explanation: |
      Les deux sont valides.
    skills:
      - classes
