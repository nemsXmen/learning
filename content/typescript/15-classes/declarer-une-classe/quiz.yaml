id: typescript-15-declarer-une-classe-quiz
kind: QUIZ
questions:
  - id: typescript-15-declarer-une-classe-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Comment instancie-t-on une classe TypeScript ?
    options:
      - User()
      - new User()
      - create User()
      - User.new()
    answer:
      - 1
    explanation: |
      On utilise l’opérateur new.
    skills:
      - classes
  - id: typescript-15-declarer-une-classe-q2
    type: true_false
    difficulty: 1
    question: |
      Le nom d’une classe TypeScript est à la fois un type et une valeur.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - classes
  - id: typescript-15-declarer-une-classe-q3
    type: multiple_choice
    difficulty: 1
    question: |
      La syntaxe de base d’une classe est :
    options:
      - type User = { }
      - class User { }
      - interface User { }
      - enum User { }
    answer:
      - 1
    explanation: |
      Mot-clé class.
    skills:
      - classes
  - id: typescript-15-declarer-une-classe-q4
    type: multiple_choice
    difficulty: 2
    question: |
      TypeScript ajoute principalement aux classes ES :
    options:
      - Un runtime différent
      - Le typage des membres et des paramètres
      - L’interdiction de new
      - Le support exclusif des interfaces
    answer:
      - 1
    explanation: |
      Annotations de types sur propriétés, méthodes, constructeur.
    skills:
      - classes
