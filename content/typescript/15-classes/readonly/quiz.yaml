id: typescript-15-readonly-quiz
kind: QUIZ
questions:
  - id: typescript-15-readonly-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Une propriété readonly peut être assignée :
    options:
      - N’importe où
      - À la déclaration ou dans le constructeur
      - Uniquement depuis l’extérieur
      - Uniquement dans les méthodes
    answer:
      - 1
    explanation: |
      Init uniquement.
    skills:
      - classes
  - id: typescript-15-readonly-q2
    type: true_false
    difficulty: 1
    question: |
      readonly protège aussi les mutations profondes des objets imbriqués.
    options:
      - "true"
      - "false"
    answer: false
    explanation: |
      Faux. C’est superficiel (réaffectation de la référence).
    skills:
      - classes
  - id: typescript-15-readonly-q3
    type: multiple_choice
    difficulty: 1
    question: |
      `public readonly id: string` dans un constructeur est :
    options:
      - Invalide
      - Une parameter property readonly
      - Uniquement private
      - Un getter
    answer:
      - 1
    explanation: |
      Pattern très courant.
    skills:
      - classes
  - id: typescript-15-readonly-q4
    type: multiple_choice
    difficulty: 2
    question: |
      readonly est particulièrement adapté pour :
    options:
      - Toutes les propriétés mutables
      - Identifiants et valeurs de configuration
      - Les méthodes uniquement
      - Les tableaux à muter souvent
    answer:
      - 1
    explanation: |
      Intention d’immutabilité de la référence.
    skills:
      - classes
