id: typescript-18-readonly-quiz
kind: QUIZ
questions:
  - id: typescript-18-readonly-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Readonly<T> rend les propriétés :
    options:
      - Optionnelles
      - Non réassignables (readonly)
      - Privées
      - never
    answer:
      - 1
    explanation: |
      Ajoute readonly.
    skills:
      - utility-types
  - id: typescript-18-readonly-q2
    type: true_false
    difficulty: 1
    question: |
      Readonly est profond par défaut.
    options:
      - "true"
      - "false"
    answer: false
    explanation: |
      Faux. Superficiel uniquement.
    skills:
      - utility-types
  - id: typescript-18-readonly-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Pour un DeepReadonly, on a besoin de :
    options:
      - Readonly uniquement
      - Un type récursif custom
      - any
      - Un enum
    answer:
      - 1
    explanation: |
      Mapped + conditional récursif.
    skills:
      - utility-types
  - id: typescript-18-readonly-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Readonly est utile pour :
    options:
      - Tout muter
      - Configs et objets figés au niveau des types
      - Remplacer private
      - Désactiver strict
    answer:
      - 1
    explanation: |
      Intention d’immutabilité.
    skills:
      - utility-types
