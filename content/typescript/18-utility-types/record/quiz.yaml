id: typescript-18-record-quiz
kind: QUIZ
questions:
  - id: typescript-18-record-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Record<K, V> représente :
    options:
      - Un tableau
      - Un objet avec clés K et valeurs V
      - Une fonction
      - Un enum
    answer:
      - 1
    explanation: |
      Map / dictionnaire typé.
    skills:
      - utility-types
  - id: typescript-18-record-q2
    type: true_false
    difficulty: 1
    question: |
      Record<"a" | "b", number> exige les clés a et b.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui, toutes les clés de l’union.
    skills:
      - utility-types
  - id: typescript-18-record-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Record est équivalent à :
    options:
      - Pick<K, V>
      - '{"[ P in K ]":"V"}'
      - Omit<K, V>
      - Partial<V>
    answer:
      - 1
    explanation: |
      Mapped type sur K.
    skills:
      - utility-types
  - id: typescript-18-record-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Un bon cas d’usage de Record est :
    options:
      - Remplacer toutes les classes
      - Tables de config / dictionnaires typés
      - Uniquement les tableaux
      - Désactiver strict
    answer:
      - 1
    explanation: |
      Maps d’objets sûres.
    skills:
      - utility-types
