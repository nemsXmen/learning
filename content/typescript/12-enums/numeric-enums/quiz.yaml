id: numeric-enums-quiz
kind: QUIZ
questions:
  - id: typescript-12-numeric-enums-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Sans valeur explicite, le premier membre d’un enum numérique vaut :
    options:
      - "1"
      - "0"
      - "-1"
      - undefined
    answer:
      - 1
    explanation: |
      L’auto-incrémentation commence à 0.
    skills:
      - enums
  - id: typescript-12-numeric-enums-q2
    type: true_false
    difficulty: 1
    question: |
      On peut assigner des valeurs numériques explicites aux membres d’un enum.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - enums
  - id: typescript-12-numeric-enums-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après `enum E { A = 5, B }`, que vaut B ?
    options:
      - "0"
      - "5"
      - "6"
      - undefined
    answer:
      - 2
    explanation: |
      Auto-incrémentation à partir de 5 → 6.
    skills:
      - enums
  - id: typescript-12-numeric-enums-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Un enum numérique classique existe-t-il à runtime ?
    options:
      - Non
      - Oui (objet JavaScript)
      - Uniquement en mode strict
      - Uniquement avec const enum
    answer:
      - 1
    explanation: |
      Il est compilé en objet JS (sauf const enum).
    skills:
      - enums
