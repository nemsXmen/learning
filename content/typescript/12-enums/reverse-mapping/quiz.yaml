- id: typescript-12-reverse-mapping-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Le reverse mapping existe pour :
  options:
    - Tous les enums
    - Les numeric enums
    - Les string enums uniquement
    - Les const enums uniquement
  answer: [1]
  explanation: >
    Principalement les numeric enums.
  skills: [enums]

- id: typescript-12-reverse-mapping-q2
  type: true_false
  difficulty: 1
  question: >
    Pour un numeric enum, `Enum[0]` peut retourner le nom du membre de valeur 0.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui.
  skills: [enums]

- id: typescript-12-reverse-mapping-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Les string enums ont-ils un reverse mapping ?
  options:
    - Oui
    - Non
    - Uniquement en mode strict
    - Uniquement avec as const
  answer: [1]
  explanation: >
    Non.
  skills: [enums]

- id: typescript-12-reverse-mapping-q4
  type: multiple_choice
  difficulty: 2
  question: >
    À quoi peut servir le reverse mapping ?
  options:
    - À rien
    - Debug, affichage du nom à partir de la valeur
    - Remplacer les interfaces
    - Désactiver le typage
  answer: [1]
  explanation: >
    Utile pour introspecter les valeurs numériques.
  skills: [enums]
