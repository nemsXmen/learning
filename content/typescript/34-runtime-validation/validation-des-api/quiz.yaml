    type: multiple_choice
    difficulty: 1
    question: |
      Un body invalide devrait souvent produire :
    options:
      - "200"
      - "400"
      - "301"
      - "101"
    answer:
      - 1
    explanation: |
      Bad Request.
    skills:
      - validation
  - id: typescript-34-validation-des-api-q2
    type: true_false
    difficulty: 1
    question: |
      Il faut aussi valider query et params, pas seulement le body.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - validation
  - id: typescript-34-validation-des-api-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après safeParse success, data est :
    options:
      - unknown
      - Typé selon le schema
      - any obligatoire
      - never
    answer:
      - 1
    explanation: |
      Affinage.
    skills:
      - validation
  - id: typescript-34-validation-des-api-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Valider après la logique métier :
    options:
      - Est idéal
      - Est trop tard
      - Remplace les tests
      - Est imposé
    answer:
      - 1
    explanation: |
      Frontière d’abord.
    skills:
      - validation
