id: le-compilateur-tsc-quiz
kind: QUIZ
questions:
  - id: typescript-01-le-compilateur-tsc-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Que fait principalement la commande `tsc` ?
    options:
      - Elle exécute le code TypeScript
      - Elle vérifie les types et peut émettre du JavaScript
      - Elle installe les dépendances
      - Elle lance un serveur de développement
    answer:
      - 1
    explanation: >
      `tsc` effectue le type-checking et, sauf option contraire, génère les
      fichiers JavaScript.
    skills:
      - typescript-basics
  - id: typescript-01-le-compilateur-tsc-q2
    type: multiple_choice
    difficulty: 1
    question: |
      Quelle option permet de vérifier les types sans générer de fichiers ?
    options:
      - --watch
      - --noEmit
      - --init
      - --strict
    answer:
      - 1
    explanation: |
      `--noEmit` demande à `tsc` de faire uniquement le type-checking.
    skills:
      - typescript-basics
  - id: typescript-01-le-compilateur-tsc-q3
    type: true_false
    difficulty: 1
    question: |
      `tsc` est un bundler qui fait du tree-shaking et de la minification.
    options:
      - "true"
      - "false"
    answer: false
    explanation: >
      Faux. `tsc` transpile fichier par fichier. Le bundling, tree-shaking et
      minification sont le rôle d’outils comme Vite, esbuild, webpack, etc.
    skills:
      - typescript-basics
  - id: typescript-01-le-compilateur-tsc-q4
    type: multiple_choice
    difficulty: 2
    question: |
      À quoi sert l’option `--watch` (ou `-w`) ?
    options:
      - À supprimer les fichiers générés
      - À recompiler automatiquement à chaque modification de fichier
      - À activer le mode strict
      - À générer des fichiers de déclaration (.d.ts)
    answer:
      - 1
    explanation: >
      Le mode watch laisse `tsc` ouvert et relance la compilation dès qu’un
      fichier source change.
    skills:
      - typescript-basics
