id: typescript-29-variables-denvironnement-quiz
kind: QUIZ
questions:
  - id: typescript-29-variables-denvironnement-q1
    type: multiple_choice
    difficulty: 1
    question: |
      process.env.X sans check est :
    options:
      - string garanti
      - string | undefined
      - number
      - boolean
    answer:
      - 1
    explanation: |
      Peut être absente.
    skills:
      - nodejs
  - id: typescript-29-variables-denvironnement-q2
    type: true_false
    difficulty: 1
    question: |
      Valider les env au démarrage (fail fast) est une bonne pratique.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - nodejs
  - id: typescript-29-variables-denvironnement-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Zod sur process.env permet de :
    options:
      - Remplacer Node
      - Obtenir une config typée et validée
      - Désactiver TypeScript
      - Ignorer les erreurs
    answer:
      - 1
    explanation: |
      Parse → type.
    skills:
      - nodejs
  - id: typescript-29-variables-denvironnement-q4
    type: multiple_choice
    difficulty: 2
    question: |
      process.env.X! :
    options:
      - Valide la présence à runtime
      - Est une assertion risquée
      - Est obligatoire
      - Active strict
    answer:
      - 1
    explanation: |
      Pas de check réel.
    skills:
      - nodejs
