id: typescript-29-cli-typee-quiz
kind: QUIZ
questions:
  - id: typescript-29-cli-typee-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Les arguments CLI bruts sont dans :
    options:
      - process.env
      - process.argv
      - document.location
      - localStorage
    answer:
      - 1
    explanation: |
      Tableau d’args.
    skills:
      - nodejs
  - id: typescript-29-cli-typee-q2
    type: true_false
    difficulty: 1
    question: |
      process.argv.slice(2) ignore node et le script path.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - nodejs
  - id: typescript-29-cli-typee-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Après le parse CLI, on devrait :
    options:
      - Tout laisser en any
      - Valider / typer les options
      - Ignorer les options
      - Utiliser uniquement DOM
    answer:
      - 1
    explanation: |
      Options métier sûres.
    skills:
      - nodejs
  - id: typescript-29-cli-typee-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Des libs comme commander servent à :
    options:
      - Remplacer TypeScript
      - Parser et structurer argv plus proprement
      - Compiler le CSS
      - Gérer le DOM
    answer:
      - 1
    explanation: |
      DX CLI.
    skills:
      - nodejs
