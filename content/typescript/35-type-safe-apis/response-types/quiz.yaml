    type: multiple_choice
    difficulty: 1
    question: |
      Un response type décrit :
    options:
      - Le CSS de la page
      - La forme JSON de succès
      - Uniquement les erreurs
      - process.env
    answer:
      - 1
    explanation: |
      Payload succès.
    skills:
      - api
