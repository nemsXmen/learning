      - Risque d’exposer des champs internes
      - Active Zod auto
      - Est imposé
    answer:
      - 1
    explanation: |
      DTO de sortie.
    skills:
      - api
  - id: typescript-35-response-types-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Les dates dans le JSON API sont souvent :
    options:
      - Des Date JS natives sur le fil
      - Des strings ISO
      - Des Buffer
