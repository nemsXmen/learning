id: typescript-35-dtos-quiz
kind: QUIZ
questions:
  - id: typescript-35-dtos-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Un DTO d’API représente :
    options:
      - Un style CSS
      - Un objet de transfert du contrat HTTP
      - Uniquement une table SQL
      - process.argv
    answer:
      - 1
    explanation: |
      Data Transfer Object.
    skills:
      - api
  - id: typescript-35-dtos-q2
    type: true_false
    difficulty: 1
    question: |
      Input DTO et output DTO peuvent différer.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - api
  - id: typescript-35-dtos-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Mapper entity → DTO sert à :
    options:
      - Rien
      - Contrôler les champs exposés
      - Supprimer TypeScript
      - Compiler le CSS
    answer:
      - 1
    explanation: |
      Encapsulation.
    skills:
      - api
  - id: typescript-35-dtos-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Un seul type pour DB + input + output :
    options:
      - Est toujours idéal
      - Mélange des préoccupations
      - Active la validation
      - Est imposé
    answer:
      - 1
    explanation: |
      Séparer les couches.
    skills:
      - api
