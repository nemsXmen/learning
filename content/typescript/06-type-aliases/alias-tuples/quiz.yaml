- id: typescript-06-alias-tuples-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Comment crée-t-on un alias pour un tuple [string, number] ?
  options:
    - type Pair = string, number
    - type Pair = [string, number]
    - type Pair = Array<string | number>
    - type Pair = { 0: string; 1: number }
  answer: [1]
  explanation: >
    On utilise la syntaxe de tuple entre crochets.
  skills: [type-aliases]

- id: typescript-06-alias-tuples-q2
  type: true_false
  difficulty: 1
  question: >
    On peut ajouter des labels dans un type alias de tuple.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui : type Point = [x: number, y: number].
  skills: [type-aliases]

- id: typescript-06-alias-tuples-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quel est un bon cas d’usage d’un alias de tuple ?
  options:
    - Une liste de longueur variable
    - Un retour multiple ordonné (status + body, start + end…)
    - Remplacer toutes les interfaces
    - Stocker des objets complexes
  answer: [1]
  explanation: >
    Les tuples excellent pour les structures ordonnées de longueur fixe.
  skills: [type-aliases]

- id: typescript-06-alias-tuples-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Les labels d’un tuple nommé existent-ils à runtime ?
  options:
    - Oui
    - Non
    - Uniquement en mode strict
    - Uniquement avec as const
  answer: [1]
  explanation: >
    Non, ce sont purement des annotations de type.
  skills: [type-aliases]
