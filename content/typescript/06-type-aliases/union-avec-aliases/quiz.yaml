- id: typescript-06-union-avec-aliases-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Comment crée-t-on une union de littéraux nommée ?
  options:
    - type Status = "a", "b"
    - type Status = "pending" | "success" | "error"
    - type Status = ["pending", "success"]
    - type Status = union("pending", "success")
  answer: [1]
  explanation: >
    On utilise | entre les littéraux.
  skills: [type-aliases]

- id: typescript-06-union-avec-aliases-q2
  type: true_false
  difficulty: 1
  question: >
    On peut unionner des type aliases entre eux.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, type C = A | B est parfaitement valide.
  skills: [type-aliases]

- id: typescript-06-union-avec-aliases-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Quel est un avantage des literal unions nommées ?
  options:
    - Elles accélèrent le runtime
    - Elles documentent les valeurs autorisées et permettent un excellent narrowing
    - Elles créent des classes
    - Elles désactivent strictNullChecks
  answer: [1]
  explanation: >
    Le nom + les littéraux donnent un contrat clair et un narrowing précis.
  skills: [type-aliases]

- id: typescript-06-union-avec-aliases-q4
  type: multiple_choice
  difficulty: 2
  question: >
    `type Result = { ok: true; value: string } | { ok: false; error: string }` est un exemple de :
  options:
    - Intersection
    - Discriminated union (via un type alias)
    - Tuple
    - Enum
  answer: [1]
  explanation: >
    C’est une union discriminée encapsulée dans un alias.
  skills: [type-aliases]
