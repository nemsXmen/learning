id: introduction-a-type-quiz
kind: QUIZ
questions:
  - id: typescript-06-introduction-a-type-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Quelle est la syntaxe pour créer un type alias ?
    options:
      - alias Nom = Type
      - type Nom = Type
      - typedef Nom = Type
      - interface Nom = Type
    answer:
      - 1
    explanation: |
      On utilise le mot-clé type.
    skills:
      - type-aliases
  - id: typescript-06-introduction-a-type-q2
    type: true_false
    difficulty: 1
    question: |
      Un type alias existe encore à runtime dans le JavaScript généré.
    options:
      - "true"
      - "false"
    answer: false
    explanation: >
      Faux. Comme toutes les annotations de types, il est effacé à la
      compilation.
    skills:
      - type-aliases
  - id: typescript-06-introduction-a-type-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Pourquoi utiliser des type aliases ?
    options:
      - Pour accélérer le runtime
      - Pour nommer, documenter et réutiliser des types
      - Pour créer des classes
      - Pour désactiver le typage
    answer:
      - 1
    explanation: |
      La lisibilité et la réutilisation sont les principaux gains.
    skills:
      - type-aliases
  - id: typescript-06-introduction-a-type-q4
    type: multiple_choice
    difficulty: 1
    question: |
      Peut-on aliaser n’importe quel type (objet, union, fonction…) ?
    options:
      - Non, uniquement les primitifs
      - Oui
      - Uniquement les objets
      - Uniquement les tableaux
    answer:
      - 1
    explanation: |
      Oui, type accepte n’importe quelle forme de type.
    skills:
      - type-aliases
