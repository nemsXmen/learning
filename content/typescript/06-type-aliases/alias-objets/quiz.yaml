- id: typescript-06-alias-objets-q1
  type: multiple_choice
  difficulty: 1
  question: >
    Comment crée-t-on un type alias pour un objet ?
  options:
    - type User = object
    - type User = { id: number; name: string }
    - interface User = { id: number }
    - class User = { id: number }
  answer: [1]
  explanation: >
    On assigne une forme d’objet au type alias.
  skills: [type-aliases]

- id: typescript-06-alias-objets-q2
  type: true_false
  difficulty: 1
  question: >
    Un type alias d’objet peut être réutilisé à plusieurs endroits.
  options:
    - "true"
    - "false"
  answer: [0]
  explanation: >
    Oui, c’est l’intérêt principal.
  skills: [type-aliases]

- id: typescript-06-alias-objets-q3
  type: multiple_choice
  difficulty: 2
  question: >
    Comment composer deux types objets avec un type alias ?
  options:
    - type Admin = User + Permissions
    - type Admin = User & { permissions: string[] }
    - type Admin = User | Permissions
    - type Admin = User.extend(Permissions)
  answer: [1]
  explanation: >
    L’intersection & permet de combiner les formes.
  skills: [type-aliases]

- id: typescript-06-alias-objets-q4
  type: multiple_choice
  difficulty: 1
  question: >
    Le typage des type aliases d’objets est :
  options:
    - Nominal
    - Structurel
    - Dynamique uniquement
    - Aucun
  answer: [1]
  explanation: >
    TypeScript reste structurellement typé.
  skills: [type-aliases]
