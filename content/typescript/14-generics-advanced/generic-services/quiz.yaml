id: typescript-14-generic-services-quiz
kind: QUIZ
questions:
  - id: typescript-14-generic-services-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Un service générique permet de :
    options:
      - Supprimer tous les types
      - Partager de la logique en restant typé par entité
      - Uniquement logger
      - Remplacer la base de données
    answer:
      - 1
    explanation: |
      Factorisation + typage.
    skills:
      - generics
  - id: typescript-14-generic-services-q2
    type: true_false
    difficulty: 1
    question: |
      Un service générique se compose souvent avec un Repository<T>.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - generics
  - id: typescript-14-generic-services-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Le risque si on n’utilise pas de generics dans les services CRUD est :
    options:
      - Aucun
      - Duplication ou recours à any
      - Interdiction de compiler
      - Runtime plus rapide
    answer:
      - 1
    explanation: |
      On duplique ou on perd le typage.
    skills:
      - generics
  - id: typescript-14-generic-services-q4
    type: multiple_choice
    difficulty: 2
    question: |
      `new CrudService<User>(userRepo)` fixe :
    options:
      - T = any
      - T = User
      - T = string
      - T = never
    answer:
      - 1
    explanation: |
      Le paramètre de type est User.
    skills:
      - generics
