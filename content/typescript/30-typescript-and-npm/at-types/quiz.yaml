id: typescript-30-at-types-quiz
kind: QUIZ
questions:
  - id: typescript-30-at-types-q1
    type: multiple_choice
    difficulty: 1
    question: |
      @types/express fournit :
    options:
      - Le serveur Express runtime
      - Des déclarations TypeScript pour Express
      - Un bundler
      - Un linter CSS
    answer:
      - 1
    explanation: |
      Types seulement.
    skills:
      - npm
  - id: typescript-30-at-types-q2
    type: true_false
    difficulty: 1
    question: |
      DefinitelyTyped est la source principale des packages @types.
    options:
      - "true"
      - "false"
    answer: true
    explanation: |
      Oui.
    skills:
      - npm
  - id: typescript-30-at-types-q3
    type: multiple_choice
    difficulty: 2
    question: |
      Lib avec types natifs + @types en parallèle peut :
    options:
      - Toujours être idéal
      - Créer des conflits
      - Accélérer Node
      - Remplacer npm
    answer:
      - 1
    explanation: |
      Doublons.
    skills:
      - npm
  - id: typescript-30-at-types-q4
    type: multiple_choice
    difficulty: 2
    question: |
      compilerOptions.types permet de :
    options:
      - Compiler le CSS
      - Restreindre les packages @types auto-inclus
      - Désactiver npm
      - Forcer any
    answer:
      - 1
    explanation: |
      Liste blanche.
    skills:
      - npm
