      - Types plus lents
      - Meilleure synchro code / types
      - Interdiction d’utiliser JS
      - Remplace npm
    answer:
      - 1
    explanation: |
      Même repo, même version.
    skills:
      - npm
  - id: typescript-30-packages-typescript-natifs-q4
    type: multiple_choice
    difficulty: 2
    question: |
      Oublier les .d.ts dans files npm :
    options:
      - N’a aucun impact
      - Peut priver les consommateurs des types
      - Accélère le runtime
      - Active strict
