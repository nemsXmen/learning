id: typescript-30-packages-typescript-natifs-quiz
kind: QUIZ
questions:
  - id: typescript-30-packages-typescript-natifs-q1
    type: multiple_choice
    difficulty: 1
    question: |
      Un package TS natif publie souvent :
    options:
      - Uniquement du .ts source sans JS
      - JS + .d.ts
      - Uniquement du CSS
      - Uniquement des tests
    answer:
      - 1
    explanation: |
      Build classique.
    skills:
      - npm
