id: javascript-fonctions-parametres-quiz
kind: QUIZ
questions:
  - id: js-parametres-q1
    type: predict_output
    difficulty: 3
    question: >
      Que renvoie `f(2)` avec `function f(a, b = a + 1) { return b; }` ?
    answer: '3'
    explanation: >
      La valeur par défaut est évaluée à l'appel et peut utiliser les paramètres déclarés
      avant elle : `b` vaut `a + 1`, donc 3.
    skills:
      - functions-parameters

  - id: js-parametres-q2
    type: true_false
    difficulty: 2
    question: >
      Passer `null` à un paramètre déclenche sa valeur par défaut.
    answer: false
    explanation: >
      Seul `undefined` — argument absent ou explicitement `undefined` — déclenche le défaut.
      `null` est une valeur comme une autre et sera utilisée telle quelle.
    skills:
      - functions-parameters

  - id: js-parametres-q3
    type: multiple_choice
    difficulty: 3
    question: >
      Que vaut `(function (a, b = 1, c) {}).length` ?
    options:
      - "1"
      - "3"
      - "2"
      - "0"
    answer: [0]
    explanation: >
      `length` compte les paramètres situés avant le premier paramètre à valeur par défaut ou
      de reste : ici, seul `a` est compté.
    skills:
      - functions-parameters

  - id: js-parametres-q4
    type: predict_output
    difficulty: 2
    question: >
      Que vaut `o.x` après `function f(o) { o.x = 1; } const o = {}; f(o);` ?
    answer: '1'
    explanation: >
      L'argument est une référence copiée : la fonction et l'appelant désignent le même objet,
      donc la propriété ajoutée est visible depuis l'extérieur.
    skills:
      - functions-parameters
