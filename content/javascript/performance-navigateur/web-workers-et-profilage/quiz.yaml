id: javascript-web-workers-et-profilage-quiz
kind: QUIZ
questions:
  - id: js-workers-q1
    type: multiple_choice
    difficulty: 3
    question: >
      Un tri de 3 millions de nombres prend 1,3 s sur le fil principal. Qu'apporte son déplacement dans un Web Worker ?
    options:
      - "La page reste réactive pendant le calcul, même s'il ne va pas plus vite"
      - "Le calcul devient environ deux fois plus rapide"
      - "Le calcul n'a plus besoin de mémoire"
      - "Le résultat est disponible de façon synchrone"
    answer: [0]
    explanation: >
      Le worker fait le calcul sur un autre fil. Démarrage et transfert compris, il ne va pas plus vite, mais le
      fil principal reste libre pour les interactions et l'affichage.
    skills:
      - web-workers-profiling

  - id: js-workers-q2
    type: multiple_answer
    difficulty: 3
    question: >
      Parmi ces valeurs, lesquelles peuvent être envoyées à un worker avec postMessage ?
    options:
      - "Un tableau d'objets simples"
      - "Une Map"
      - "Une fonction fléchée"
      - "Un élément du DOM"
      - "Un Float64Array"
    answer: [0, 1, 4]
    explanation: >
      Le structured clone copie objets, tableaux, Map, Set, dates et tableaux typés. Les fonctions et les nœuds
      du DOM ne se clonent pas et provoquent une DataCloneError.
    skills:
      - web-workers-profiling

  - id: js-workers-q3
    type: predict_output
    difficulty: 4
    question: >
      `const v = new Float64Array(1000); worker.postMessage(v, [v.buffer]); console.log(v.length);`
      Qu'est-ce qui est affiché ?
    answer: '0'
    explanation: >
      Le tampon a été transféré : il appartient désormais au worker, et le tableau devient inutilisable côté
      page, avec une longueur de 0.
    skills:
      - web-workers-profiling

  - id: js-workers-q4
    type: true_false
    difficulty: 3
    question: >
      Une tâche est dite longue lorsqu'elle occupe le fil principal plus de 50 ms.
    answer: true
    explanation: >
      Au-delà de 50 ms, une interaction qui arrive pendant la tâche attend visiblement. C'est le seuil utilisé
      par l'API longtask et par les DevTools.
    skills:
      - web-workers-profiling

  - id: js-workers-q5
    type: multiple_choice
    difficulty: 3
    question: >
      Pour profiler une lenteur signalée par des utilisateurs sur mobile, que faut-il activer dans l'onglet
      Performance ?
    options:
      - "Le ralentissement du processeur, par exemple 4× ou 6×"
      - "Le mode plein écran"
      - "La désactivation du cache uniquement"
      - "Rien : un poste de développement est représentatif"
    answer: [0]
    explanation: >
      Un poste de développement est bien plus rapide qu'un téléphone moyen. Ralentir le processeur fait
      apparaître les tâches longues que vivent les utilisateurs.
    skills:
      - web-workers-profiling
