id: javascript-chaines-creer-quiz
kind: QUIZ
questions:
  - id: js-chaines-q1
    type: predict_output
    difficulty: 2
    question: >
      Que vaut `'Total : ' + 1 + 2` ?
    answer: 'Total : 12'
    explanation: >
      L'évaluation va de gauche à droite : `'Total : ' + 1` donne `'Total : 1'`, puis la
      concaténation avec `2` donne `'Total : 12'`. Dans un template literal, on écrirait le
      calcul dans `${1 + 2}`.
    skills:
      - strings-basics

  - id: js-chaines-q2
    type: multiple_choice
    difficulty: 1
    question: >
      Quelle écriture insère la valeur de la variable `prenom` dans le texte ?
    options:
      - "`Bonjour ${prenom}`"
      - "'Bonjour ${prenom}'"
      - "`Bonjour $prenom`"
      - "'Bonjour ' ${prenom}"
    answer: [0]
    explanation: >
      Seuls les backticks interpolent, et l'expression doit être entourée de `${ }`. Entre
      apostrophes, `${prenom}` reste un simple texte ; la dernière écriture est une erreur de
      syntaxe.
    skills:
      - strings-basics

  - id: js-chaines-q3
    type: predict_output
    difficulty: 3
    question: >
      Que vaut `'😀'.length` ?
    answer: '2'
    explanation: >
      `length` compte les unités de code UTF-16, et un emoji en occupe deux. Pour compter les
      caractères Unicode, on écrit `[...texte].length`, qui vaut ici 1.
    skills:
      - strings-basics

  - id: js-chaines-q4
    type: true_false
    difficulty: 1
    question: >
      `mot[0] = 'X'` remplace la première lettre de la chaîne `mot`.
    answer: false
    explanation: >
      Les chaînes sont immuables : l'affectation est ignorée, ou lève une `TypeError` en mode
      strict. Pour obtenir une chaîne modifiée, on en construit une nouvelle, par exemple
      `'X' + mot.slice(1)`.
    skills:
      - strings-basics
