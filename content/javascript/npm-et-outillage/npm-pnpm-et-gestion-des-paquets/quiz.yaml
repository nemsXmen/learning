id: javascript-npm-pnpm-et-gestion-des-paquets-quiz
kind: QUIZ
questions:
  - id: js-pnpm-q1
    type: multiple_choice
    difficulty: 3
    question: >
      Un projet installé avec npm importe un paquet qu'il n'a pas déclaré. Que se passe-t-il après une migration vers pnpm ?
    options:
      - "L'import échoue : pnpm n'expose à la racine que les dépendances déclarées"
      - "L'import fonctionne comme avant"
      - "pnpm ajoute automatiquement la dépendance au package.json"
      - "L'import fonctionne mais affiche un avertissement"
    answer: [0]
    explanation: >
      C'est une dépendance fantôme. pnpm ne crée à la racine de node_modules que des liens vers les dépendances
      déclarées : Node ne trouve plus le paquet, et il faut le déclarer.
    skills:
      - js-package-managers

  - id: js-pnpm-q2
    type: multiple_choice
    difficulty: 2
    question: >
      Quel équivalent pnpm de `npm ci` utiliser en intégration continue ?
    options:
      - "pnpm install --frozen-lockfile"
      - "pnpm update"
      - "pnpm add"
      - "pnpm dlx install"
    answer: [0]
    explanation: >
      --frozen-lockfile installe exactement le verrou et échoue s'il ne concorde pas avec package.json, comme npm ci.
    skills:
      - js-package-managers

  - id: js-pnpm-q3
    type: multiple_answer
    difficulty: 3
    question: >
      Qu'apporte le champ "packageManager": "pnpm@10.15.0" dans package.json ?
    options:
      - "Toute l'équipe utilise le même gestionnaire, dans la même version"
      - "pnpm ou Corepack peuvent exécuter automatiquement la version demandée"
      - "Il installe pnpm dans node_modules comme une dépendance"
      - "Il évite de produire deux fichiers de verrouillage concurrents"
    answer: [0, 1, 3]
    explanation: >
      Le champ déclare l'outil et sa version exacte ; pnpm et Corepack le lisent. Ce n'est pas une dépendance du
      projet : rien n'est ajouté à node_modules.
    skills:
      - js-package-managers

  - id: js-pnpm-q4
    type: true_false
    difficulty: 3
    question: >
      Depuis pnpm 10, les scripts postinstall des dépendances ne sont exécutés que pour les paquets explicitement
      approuvés.
    answer: true
    explanation: >
      pnpm affiche « Ignored build scripts » et l'on approuve les paquets de confiance avec pnpm approve-builds,
      qui les inscrit dans onlyBuiltDependencies.
    skills:
      - js-package-managers
