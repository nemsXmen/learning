id: javascript-tableaux-immutabilite-quiz
kind: QUIZ
questions:
  - id: js-immutabilite-q1
    type: multiple_choice
    difficulty: 1
    question: >
      Quelle écriture ajoute un élément sans modifier le tableau `t` ?
    options:
      - "[...t, 4]"
      - "t.push(4)"
      - "t.unshift(4)"
      - "t.splice(t.length, 0, 4)"
    answer: [0]
    explanation: >
      `[...t, 4]` crée un nouveau tableau contenant les éléments de `t` suivis de 4. `push`,
      `unshift` et `splice` modifient tous le tableau d'origine.
    skills:
      - arrays-immutability

  - id: js-immutabilite-q2
    type: predict_output
    difficulty: 2
    question: >
      Après `const [premier, ...reste] = [1, 2, 3];`, que vaut `reste.length` ?
    answer: '2'
    explanation: >
      `premier` reçoit 1, et l'élément de reste reçoit un tableau des éléments suivants,
      `[2, 3]`, de longueur 2.
    skills:
      - arrays-immutability

  - id: js-immutabilite-q3
    type: true_false
    difficulty: 2
    question: >
      `const copie = [...liste]` crée une copie profonde des objets contenus dans `liste`.
    answer: false
    explanation: >
      Le spread crée un nouveau tableau, mais les objets qu'il contient sont les mêmes que dans
      l'original : c'est une copie superficielle. `structuredClone` crée une copie profonde.
    skills:
      - arrays-immutability

  - id: js-immutabilite-q4
    type: multiple_answer
    difficulty: 2
    question: >
      Quelles méthodes renvoient un nouveau tableau sans modifier l'original ?
    options:
      - "toSorted"
      - "sort"
      - "with"
      - "reverse"
    answer: [0, 2]
    explanation: >
      `toSorted` et `with`, ajoutés avec ES2023, renvoient une nouvelle version du tableau.
      `sort` et `reverse` modifient le tableau sur place.
    skills:
      - arrays-immutability
