id: javascript-builder-adapter-facade-quiz
kind: QUIZ
questions:
  - id: js-structurels-q1
    type: multiple_choice
    difficulty: 3
    question: >
      Un fournisseur de paiement renvoie des montants en chaînes et des statuts en anglais. Quel pattern isole
      l'application de ces détails ?
    options:
      - "Un adapter"
      - "Une facade"
      - "Un builder"
      - "Un singleton"
    answer: [0]
    explanation: >
      L'adapter convertit notre contrat vers l'API externe, formats et erreurs compris. Changer de fournisseur ne
      touche alors qu'un fichier.
    skills:
      - js-structural-patterns

  - id: js-structurels-q2
    type: multiple_choice
    difficulty: 3
    question: >
      Pourquoi un builder renvoie-t-il un nouveau builder à chaque étape plutôt que de se modifier lui-même ?
    options:
      - "Pour qu'une base partagée ne soit pas modifiée par ceux qui l'enrichissent"
      - "Parce que JavaScript interdit de modifier un objet dans une méthode"
      - "Pour que construire() soit plus rapide"
      - "Pour pouvoir supprimer la méthode construire()"
    answer: [0]
    explanation: >
      Avec un builder immuable, `base.page(3)` et `base.texte('lampe')` produisent deux recherches indépendantes : ni
      l'une ni l'autre ne modifie `base`.
    skills:
      - js-structural-patterns

  - id: js-structurels-q3
    type: multiple_answer
    difficulty: 3
    question: >
      Qu'est-ce qui caractérise une facade bien conçue ?
    options:
      - "Elle expose quelques fonctions de haut niveau"
      - "Elle orchestre plusieurs modules dans le bon ordre"
      - "Elle contient les règles métier des modules qu'elle coordonne"
      - "Les appelants n'ont pas à connaître les sous-systèmes"
    answer: [0, 1, 3]
    explanation: >
      La facade simplifie et orchestre. Les règles métier restent dans le domaine ; une facade qui les absorbe devient
      un module fourre-tout.
    skills:
      - js-structural-patterns

  - id: js-structurels-q4
    type: true_false
    difficulty: 2
    question: >
      util.promisify, qui transforme une fonction à callback en fonction à promesse, est une forme d'adaptateur.
    answer: true
    explanation: >
      Il convertit une interface existante, le style callback, vers celle qu'attend le code appelant, les promesses.
    skills:
      - js-structural-patterns
