id: ai-09-metrics-quiz
kind: QUIZ
questions:
  - id: ai-09-metrics-q1
    type: multiple_choice
    difficulty: 3
    question: "Quelle métrique répond principalement à la question « parmi les vrais positifs, combien ont été retrouvés » ?"
    options: ["Precision","Recall","MRR","nDCG"]
    answer: [1]
    explanation: "Le recall mesure la proportion des vrais positifs effectivement retrouvés."
    skills: [ai-evaluation]
  - id: ai-09-metrics-q2
    type: multiple_choice
    difficulty: 4
    question: "Pourquoi Recall@k est-il pertinent pour un retriever RAG ?"
    options: ["Il prouve la factualité de la réponse","Il mesure la présence des éléments pertinents dans les k premiers résultats","Il mesure uniquement le coût","Il garantit que le LLM utilisera les sources"]
    answer: [1]
    explanation: "Recall@k mesure la récupération des éléments pertinents, pas leur utilisation correcte par le générateur."
    skills: [ai-evaluation]
  - id: ai-09-metrics-q3
    type: multiple_choice
    difficulty: 4
    question: "Que peut indiquer une mauvaise calibration ?"
    options: ["Les probabilités annoncées ne correspondent pas bien aux fréquences de succès observées","Le retriever ne contient aucun document","Le modèle est nécessairement plus lent","Toutes les réponses sont fausses"]
    answer: [0]
    explanation: "La calibration compare les probabilités prédites aux fréquences de réussite observées."
    skills: [ai-evaluation]
