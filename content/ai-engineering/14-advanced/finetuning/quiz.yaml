id: ai-14-advanced-finetuning-quiz
kind: QUIZ
questions:
  - id: ai-14-advanced-finetuning-q1
    type: multiple_choice
    difficulty: 3
    question: "Quel problème le fine-tuning traite-t-il principalement ?"
    options: ["Adapter un comportement ou une spécialisation", "Ajouter automatiquement des documents récents", "Remplacer l'évaluation", "Gérer les ACL"]
    answer: [0]
    explanation: "Le fine-tuning adapte les paramètres du modèle."
    skills: [ai-finetuning]

  - id: ai-14-advanced-finetuning-q2
    type: true_false
    difficulty: 2
    question: "Un dataset très redondant peut favoriser le surapprentissage."
    answer: true
    explanation: "La diversité des exemples est importante."
    skills: [ai-finetuning]

  - id: ai-14-advanced-finetuning-q3
    type: multiple_choice
    difficulty: 3
    question: "Quand le RAG est-il souvent plus adapté ?"
    options: ["Pour apporter une connaissance externe changeante", "Pour changer uniquement le style", "Pour réduire tous les coûts", "Pour supprimer les évaluations"]
    answer: [0]
    explanation: "Le RAG fournit du contexte externe sans modifier les poids."
    skills: [ai-finetuning]

  - id: ai-14-advanced-finetuning-q4
    type: multiple_choice
    difficulty: 3
    question: "Que faut-il comparer après adaptation ?"
    options: ["Le modèle adapté et la baseline sur cas métier et généraux", "Uniquement la loss d'entraînement", "Uniquement le nombre de paramètres", "Uniquement la vitesse"]
    answer: [0]
    explanation: "Il faut détecter qualité et régressions."
    skills: [ai-finetuning]
