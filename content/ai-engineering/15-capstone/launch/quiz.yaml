id: ai-15-capstone-launch-quiz
kind: QUIZ
questions:
  - id: ai-15-capstone-launch-q1
    type: multiple_choice
    difficulty: 3
    question: "Quel ordre correspond à un rollout progressif ?"
    options: ["Staging → petite cohorte → monitoring → généralisation", "Production → test → staging", "Rollback → lancement → test", "Tous les utilisateurs immédiatement"]
    answer: [0]
    explanation: "Le rollout progressif limite l'impact d'une régression."
    skills: [ai-capstone]

  - id: ai-15-capstone-launch-q2
    type: multiple_answer
    difficulty: 3
    question: "Que surveiller après lancement ?"
    options: ["Erreurs", "p95/p99", "Coût par tâche", "Qualité"]
    answer: [0, 1, 2, 3]
    explanation: "Ces indicateurs décrivent santé, performance et valeur."
    skills: [ai-capstone]

  - id: ai-15-capstone-launch-q3
    type: true_false
    difficulty: 2
    question: "Les prompts et modèles doivent rester versionnés après lancement."
    answer: true
    explanation: "Les changements production doivent rester reproductibles."
    skills: [ai-capstone]

  - id: ai-15-capstone-launch-q4
    type: multiple_choice
    difficulty: 3
    question: "Que doit contenir un runbook incident ?"
    options: ["Détection, mitigation, rollback et récupération", "Uniquement une capture d'écran", "Uniquement le prompt", "Uniquement le budget"]
    answer: [0]
    explanation: "Un runbook guide les actions sous pression."
    skills: [ai-capstone]
