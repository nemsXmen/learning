id: ai-13-product-ux-quiz
kind: QUIZ
questions:
  - id: ai-13-product-ux-q1
    type: multiple_choice
    difficulty: 3
    question: "Pourquoi afficher une source dans une réponse RAG ?"
    options: ["Pour aider à vérifier la réponse", "Pour augmenter les tokens", "Pour cacher l'incertitude", "Pour remplacer l'auth"]
    answer: [0]
    explanation: "La provenance aide à calibrer la confiance."
    skills: [ai-product]

  - id: ai-13-product-ux-q2
    type: true_false
    difficulty: 2
    question: "Une action sensible peut nécessiter une confirmation humaine même si le modèle la propose."
    answer: true
    explanation: "L'autorisation d'un effet de bord doit rester déterministe."
    skills: [ai-product]

  - id: ai-13-product-ux-q3
    type: multiple_choice
    difficulty: 3
    question: "Quel état UX doit être explicite pendant un appel long ?"
    options: ["Progression/attente", "Mot de passe serveur", "Prompt système complet", "Clé API"]
    answer: [0]
    explanation: "L'utilisateur doit comprendre que le système travaille."
    skills: [ai-product]

  - id: ai-13-product-ux-q4
    type: multiple_choice
    difficulty: 3
    question: "Que faire face à une réponse incorrecte ?"
    options: ["Permettre correction/régénération et afficher les preuves disponibles", "La présenter comme certaine", "Supprimer les sources", "Exécuter automatiquement"]
    answer: [0]
    explanation: "L'UX doit donner contrôle et visibilité."
    skills: [ai-product]
