id: ai-13-product-analytics-quiz
kind: QUIZ
questions:
  - id: ai-13-product-analytics-q1
    type: multiple_choice
    difficulty: 3
    question: "Quelle métrique reflète mieux la valeur qu'un simple nombre de générations ?"
    options: ["Taux d'acceptation ou outcome", "Nombre de prompts", "Tokens bruts", "Nombre de modèles"]
    answer: [0]
    explanation: "L'acceptation relie usage et valeur."
    skills: [ai-product]

  - id: ai-13-product-analytics-q2
    type: true_false
    difficulty: 2
    question: "Le feedback utilisateur peut contribuer à construire un dataset d'amélioration."
    answer: true
    explanation: "Corrections et feedback peuvent devenir des signaux d'évaluation."
    skills: [ai-product]

  - id: ai-13-product-analytics-q3
    type: multiple_answer
    difficulty: 3
    question: "Quels éléments doivent être versionnés pour une expérimentation AI ?"
    options: ["Prompt", "Modèle", "Dataset d'évaluation", "Configuration"]
    answer: [0, 1, 2, 3]
    explanation: "Sans versionnement, la comparaison n'est pas reproductible."
    skills: [ai-product]

  - id: ai-13-product-analytics-q4
    type: multiple_choice
    difficulty: 3
    question: "Pourquoi minimiser les données d'analytics ?"
    options: ["Réduire exposition et risques de confidentialité", "Augmenter le coût", "Empêcher toute mesure", "Rendre les métriques inutiles"]
    answer: [0]
    explanation: "Collecter uniquement ce qui est nécessaire réduit les risques."
    skills: [ai-product]
